  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'La mia uscita di pesca'});return;}catch(err){if(err.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lenza-cattura.png';a.click();toast('Immagine scaricata');
}

/* ===================== Riconoscimento sul dispositivo (BioCLIP, gratuito e offline) ===================== */
// Specie: modello open source BioCLIP (MIT) eseguito nel browser con ONNX Runtime Web.
// Punteggio = somiglianza con le descrizioni scientifiche delle specie + somiglianza con foto di esempio
// + le catture confermate dall'utente; poi pesato per l'ambiente di pesca (mare, lago, fiume).

/* ===================== Misura sulla foto ===================== */
let MEAS=null;
function openMeasure(src,target,pre){
  MEAS={src,target,pts:pre?.pts?pre.pts.map(p=>[...p]):[],ref:pre?.ref??3,refCm:null,drag:-1};
  openSheet(`<h2>📏 Misura il pesce</h2><p class="small mut" id="mhelp"></p><p class="small" id="mrefnow" style="margin:2px 0 8px"></p>
    <div class="mwrap"><canvas id="mcv"></canvas></div>
    <label>Oggetto di riferimento nella foto</label><div class="chips" id="mrefs"></div>
    <div id="mcustom" style="display:none;margin-top:8px"><input type="number" step="0.1" min="0.5" placeholder="Lunghezza del riferimento in cm" oninput="MEAS.refCm=+this.value;drawMeasure()"></div>
    <div id="mshoe" style="display:none;margin-top:8px" class="row"><span class="small">Numero di scarpa</span><input type="number" min="30" max="50" step="0.5" style="width:90px" value="${shoeSize()}" oninput="if(+this.value>=30&&+this.value<=50){LS.set('shoesize',+this.value);drawMeasure();}"></div>
    <div class="aigrid" style="margin-top:12px"><div><b id="mlen">—</b><span>lunghezza</span></div><div><b id="mw">—</b><span>peso stimato</span></div><div><b id="mpts">0/4</b><span>punti</span></div></div>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost" style="flex:1" onclick="MEAS.pts=[];drawMeasure()">↺ Ricomincia</button><button class="btn" style="flex:2" id="mok" onclick="applyMeasure()" disabled>Usa questa misura</button></div>`);
  loadImg(src).then(img=>{MEAS.img=img;const cv=document.getElementById('mcv');const W=cv.parentElement.clientWidth;cv.width=W*devicePixelRatio;cv.height=W*img.naturalHeight/img.naturalWidth*devicePixelRatio;cv.style.width=W+'px';cv.style.height=(W*img.naturalHeight/img.naturalWidth)+'px';
    const pos=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height];};
    cv.onpointerdown=ev=>{const [x,y]=pos(ev),ar=cv.height/cv.width;let best=-1,bd=.05;MEAS.pts.forEach((p,i)=>{const d=Math.hypot(p[0]-x,(p[1]-y)*ar);if(d<bd){bd=d;best=i;}});
      if(best>=0)MEAS.drag=best;else if(MEAS.pts.length<4){MEAS.pts.push([x,y]);MEAS.drag=MEAS.pts.length-1;}cv.setPointerCapture(ev.pointerId);drawMeasure();};
    cv.onpointermove=ev=>{if(MEAS.drag<0)return;MEAS.pts[MEAS.drag]=pos(ev);drawMeasure();};
    cv.onpointerup=()=>{MEAS.drag=-1;};
    drawMeasure();});
}
function measResult(){
  const M=MEAS;if(M.pts.length<4||!M.img)return null;
  const W=M.img.naturalWidth,H=M.img.naturalHeight,d=(a,b)=>Math.hypot((a[0]-b[0])*W,(a[1]-b[1])*H);
  const rc=M.ref<REFS.length?refCm(M.ref):M.refCm;if(!rc)return null;
  const rp=d(M.pts[2],M.pts[3]);if(rp<5)return null;
  return Math.round(d(M.pts[0],M.pts[1])/rp*rc*10)/10;
}
function measSpecies(){const t=MEAS.target;return t==='live'?LIVEQ.sp:t==='assist'?ASSIST?.st?.r?.species:DRAFT?.catches?.[+t]?.sp;}
function drawMeasure(){
  const M=MEAS,cv=document.getElementById('mcv');if(!cv||!M.img)return;const g=cv.getContext('2d'),W=cv.width,H=cv.height,s=devicePixelRatio;
  g.drawImage(M.img,0,0,W,H);
  const shoe=M.ref===3,P=M.pts.map(p=>[p[0]*W,p[1]*H]),col=['#2fe0cf','#2fe0cf','#ffb547','#ffb547'],lab=['Muso','Coda',shoe?'Punta':'Rif. A',shoe?'Tallone':'Rif. B'];
  const line=(a,b,c)=>{g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=6*s;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.strokeStyle=c;g.lineWidth=3*s;g.stroke();};
  if(P.length>=2)line(P[0],P[1],col[0]);if(P.length>=4)line(P[2],P[3],col[2]);
  P.forEach((p,i)=>{g.fillStyle=col[i];g.strokeStyle='#fff';g.lineWidth=2*s;g.beginPath();g.arc(p[0],p[1],9*s,0,7);g.fill();g.stroke();g.font=`700 ${12*s}px Outfit, sans-serif`;g.fillStyle='#fff';g.strokeStyle='rgba(0,0,0,.7)';g.lineWidth=3*s;g.strokeText(lab[i],p[0]+12*s,p[1]-10*s);g.fillText(lab[i],p[0]+12*s,p[1]-10*s);});
  const steps=['Tocca la punta del <b>muso</b> del pesce','Ora tocca la fine della <b>coda</b>',shoe?`Tocca la <b>punta della scarpa</b> (n. ${shoeSize()})`:'Tocca un\'estremità dell\'<b>oggetto di riferimento</b>',shoe?'Ora tocca il <b>tallone</b> della scarpa':'Tocca l\'altra estremità del riferimento','Puoi trascinare i punti per correggerli'];
  document.getElementById('mhelp').innerHTML=steps[Math.min(4,M.pts.length)];
  document.getElementById('mshoe').style.display=shoe?'flex':'none';
  document.getElementById('mrefnow').innerHTML=`Riferimento: <b style="color:var(--acc2)">${esc(M.ref<REFS.length?refName(M.ref):'Altro')}</b> · se nella foto hai usato altro (per esempio la mano), sceglilo qui sotto`;
  document.getElementById('mrefs').innerHTML=[...REFS.map((r,i)=>`<span class="chip ${M.ref===i?'on':''}" onclick="MEAS.ref=${i};document.getElementById('mcustom').style.display='none';drawMeasure()">${refName(i)}</span>`),`<span class="chip ${M.ref===REFS.length?'on':''}" onclick="MEAS.ref=${REFS.length};document.getElementById('mcustom').style.display='block';drawMeasure()">Altro…</span>`].join('');
  document.getElementById('mcustom').style.display=M.ref===REFS.length?'block':'none';
  const len=measResult(),w=len?estW(measSpecies(),len):null;
  document.getElementById('mlen').textContent=len?fmt1(len)+' cm':'—';
  document.getElementById('mw').textContent=w?fmt1(w)+' kg':len?'specie?':'—';
  document.getElementById('mpts').textContent=M.pts.length+'/4';
  document.getElementById('mok').disabled=!len;
}
function applyMeasure(){
  const len=measResult();if(!len)return;const t=MEAS.target,sp=measSpecies(),w=estW(sp,len);
  const st=stOf(t);if(st?.m){st.m.len=len;st.m.pts=MEAS.pts.map(p=>[...p]);st.m.ref=MEAS.ref;st.m.refOk=st.m.fishOk=true;st.m.manual=true;st.m.kind=REFS[MEAS.ref]?.[2]?.t||null;const mm=st.m;measPreview(MEAS.src,mm.pts).then(u=>{mm.preview=u;redraw(t);}).catch(()=>{});}
  if(t==='assist'){closeSheet();render();toast(`📏 ${fmt1(len)} cm${w?' · ≈ '+fmt1(w)+' kg':''}`);return;}
  closeSheet();
  if(t==='live'){LIVEQ.l=String(Math.round(len));if(w)LIVEQ.w=String(Math.round(w*100)/100);render();}
  else{const c=DRAFT.catches[+t];c.l=Math.round(len);if(w)c.w=Math.round(w*100)/100;drawEntry();}
  toast(`📏 ${fmt1(len)} cm${w?' · ≈ '+fmt1(w)+' kg':''}`);
}

/* ===================== Misura automatica (SlimSAM + analisi delle forme) ===================== */
// 1) SlimSAM ritaglia gli oggetti della foto partendo da una griglia di 16×16 punti;
// 2) il pesce è la sagoma allungata e irregolare che BioCLIP giudica "pesce" (poi rifinita con 5 punti lungo il corpo);
// 3) il riferimento si riconosce dalla forma: cerchio (monete) o rettangolo con proporzioni note (carta, accendino…);
// 4) muso e coda sono gli estremi del pesce lungo il suo asse principale.
const autoRefs=()=>REFS.map((r,i)=>[r,i]).filter(([r])=>r[2]);
function measBlock(st,target){
  const m=st.m,sp=st.r?.species;
  if(!m)return st.r?.is_fish?`<button class="btn" style="margin-top:10px;width:100%" onclick="runMeasure('${target}')">📏 Misura lunghezza e peso</button>
    <div class="small mut" style="margin-top:4px">Facoltativo: serve un riferimento accanto al pesce (moneta, bancomat, scarpa, piede o mano aperta).</div>`:'';
  if(m.loading)return `<div class="mrow"><div class="aispin" style="width:22px;height:22px;border-width:2px"></div><span class="small">Cerco il riferimento e misuro… <b>${Math.round((m.pct||0)*100)}%</b></span></div>`;
  if(m.err)return `<div class="small" style="margin-top:8px;color:var(--acc2)">⚠️ ${esc(m.err)}</div>`;
  const refChips=`<div class="chips" style="margin-top:6px">${autoRefs().map(([r,i])=>`<span class="chip" style="padding:3px 9px;font-size:12px;${m.ref===i?'background:var(--acc);color:#03282a':''}" onclick="setAutoRef('${target}',${i})">${esc(refName(i))}</span>`).join('')}</div>`;
  const manual=`<u style="cursor:pointer;color:var(--acc)" onclick="openMeasureFor('${target}')">📏 Controlla o correggi i punti</u>`;
  if(m.len){const w=estW(sp,m.len);return `<div class="aigrid" style="margin-top:10px"><div><b>${fmt1(m.len)} cm</b><span>lunghezza</span></div><div><b>${w?fmt1(w)+' kg':'—'}</b><span>peso stimato</span></div><div><b style="font-size:12px">${esc(refName(m.ref))}</b><span>${m.manual?'segnato da te':m.forced?'riferimento scelto':'riferimento trovato'}</span></div></div>
    ${m.fishCut&&!m.manual?'<div class="small" style="color:var(--acc2)">✂️ Il pesce esce dalla foto (testa o coda tagliate): la misura è per difetto. Meglio rifare la foto con tutto il pesce dentro.</div>':''}
    ${m.refCut&&!m.manual?`<div class="small" style="color:var(--acc2)">✂️ ${m.kind==='foot'?'Il piede':'La scarpa'} esce dalla foto: la misura è sbagliata, rifai la foto con tutto dentro.</div>`:''}
    ${m.kind==='hand'?'<div class="small" style="color:var(--acc2)">✋ Con la mano la misura è approssimativa (le mani sono diverse): meglio una moneta o un bancomat.</div>':''}
    ${m.preview?`<img src="${m.preview}" alt="" style="width:100%;border-radius:14px;margin:8px 0 4px;display:block" onclick="openMeasureFor('${target}')">
      <div class="small mut">Linea azzurra: pesce · linea arancione: ${esc(refName(m.ref))}. Se non sono giuste, tocca la foto per correggerle.</div>`:''}
    <div class="small">${manual}</div><details class="small" style="margin-top:4px"><summary class="mut" style="cursor:pointer">Il riferimento è un altro?</summary>${refChips}</details>`;}
  if(m.fishCut)return `<div class="small" style="margin-top:8px">📏 <b>Il pesce esce dalla foto</b> (testa o coda tagliate): non posso misurarlo. Rifai la foto con tutto il pesce dentro${m.refOk?'':', e accanto una moneta, un bancomat o la tua scarpa'}. ${manual}</div>`;
  if(!m.fishOk&&m.refOk)return `<div class="small" style="margin-top:8px">📏 Ho trovato «${esc(refName(m.ref))}» ma non riesco a isolare il pesce: fotografalo intero, dall'alto. ${manual}</div>`;
  return `<div class="small" style="margin-top:8px">📏 Non trovo mano, scarpa, moneta o bancomat nella foto.${m.person?' <span class="mut">Con il pesce in mano la misura è difficile: per una misura precisa appoggialo a terra con accanto una moneta o il bancomat.</span>':''} <b>Segna punta e tallone della tua scarpa (n. ${shoeSize()})</b>${m.fishOk?', il pesce l\'ho già trovato':''}.
    <button class="btn" style="margin-top:8px;padding:9px 14px" onclick="openMeasureFor('${target}',3)">👟 Segna la scarpa sulla foto</button>
    <details style="margin-top:6px"><summary class="mut" style="cursor:pointer">Nella foto c'è un altro riferimento?</summary>${refChips}</details></div>`;
}
function stOf(t){return t==='live'?LIVEAI:t==='assist'?ASSIST?.st:ENTRYAI[+t];}
function photoOf(t){return t==='live'?(LIVEQ.big||LIVEQ.photo):t==='assist'?(ASSIST.big||ASSIST.photo):(DRAFT.catches[+t].big||DRAFT.catches[+t].photo);}
function redraw(t){if(t==='live'){if(S.tab==='live')render();}else if(t==='assist'){if(S.tab==='pesce')render();}else if(document.getElementById('sheet').classList.contains('on')&&DRAFT&&!MEAS_OPEN())drawEntry();}
function applyAuto(t){
  const st=stOf(t),m=st?.m;if(!m?.len)return;const sp=st.r?.species,w=estW(sp,m.len);
  if(t==='live'){LIVEQ.l=String(Math.round(m.len));LIVEQ.w=w?String(Math.round(w*100)/100):LIVEQ.w;}
  else if(t!=='assist'){const c=DRAFT.catches[+t];if(c){c.l=Math.round(m.len);if(w)c.w=Math.round(w*100)/100;}}
}
async function runMeasure(t,force){
  const st=stOf(t);if(!st)return;const src=photoOf(t);
  st.m={loading:true,pct:0};redraw(t);
  let last=0;
  try{
    const m=await autoMeasure(src,force,p=>{st.m.pct=p;if(Date.now()-last>400){last=Date.now();const el=document.querySelector('.mrow b');if(el)el.textContent=Math.round(p*100)+'%';}});
    if(stOf(t)!==st)return;
    try{m.preview=await measPreview(src,m.pts);}catch(e){}
    st.m=m;applyAuto(t);
    // nessun riferimento trovato: nella sessione di pesca si apre subito la foto per segnare la scarpa
    if(!m.refOk&&!m.forced&&!m.fishCut&&t==='live'&&S.tab==='live'){redraw(t);openMeasureFor(t,3);return;}
  }catch(e){st.m={err:'Misura automatica non riuscita: '+aiErrMsg(e)};}
  redraw(t);
}
function setAutoRef(t,i){runMeasure(t,i);}
function openMeasureFor(t,ref){const st=stOf(t),m=st?.m;openMeasure(photoOf(t),t,{pts:m?.pts||null,ref:ref??m?.ref??3});}

/* ===================== Schede risultato ===================== */
function aiCard(st,target){
  if(!st)return '';
  if(st.needModel)return `<div class="aibox"><span style="font-size:24px">🧠</span><div style="flex:1"><b>Riconoscimento automatico gratuito</b><div class="small mut">Scarica una volta i modelli (circa 155 MB, meglio con Wi-Fi): poi specie, misura e peso si calcolano da soli, anche senza internet.</div>
    ${MODEL_DL?`<div class="dlb"><div id="dlbar" style="width:${(MODEL_DL.st.pct*100).toFixed(1)}%"></div></div><div class="small mut"><span id="dlpct">${Math.round(MODEL_DL.st.pct*100)}%</span> scaricato…</div>`:`<button class="btn" style="margin-top:8px;padding:9px 14px" onclick="downloadModel().then(()=>aiRetry('${target}')).catch(e=>toast(aiErrMsg(e)))">⬇️ Scarica e riconosci</button>`}</div></div>`;
  if(st.loading)return `<div class="aibox"><div class="aispin"></div><div><b>Riconosco il pesce…</b><div class="small mut">Poi misuro lunghezza e peso · sul telefono, senza internet</div></div></div>`;
  if(st.err)return `<div class="aibox err"><span style="font-size:22px">⚠️</span><div style="flex:1"><b>${esc(st.err)}</b><div class="small"><u style="cursor:pointer" onclick="aiRetry('${target}')">Riprova</u></div></div></div>`;
  const r=st.r;if(!r)return '';
  if(!r.is_fish)return `<div class="aibox err"><span style="font-size:22px">🤔</span><div><b>Non sembra un pesce</b><div class="small mut">Inquadra il pesce intero, da vicino e di lato. Se è un pesce, scegli la specie qui sotto.</div>${target!=='assist'?`<div class="small" style="margin-top:6px"><u style="cursor:pointer;color:var(--acc)" onclick="openMeasureFor('${target}')">📏 Misura a mano sulla foto</u></div>`:''}</div></div>`;
  const pick=r.confidence==null,pc=pick?100:Math.round(r.confidence*100),col=pc>=70?'var(--ok)':pc>=40?'var(--acc2)':'var(--bad)';
  return `<div class="aibox ok"><div style="flex:1;min-width:0">
    <div class="small mut" style="text-transform:uppercase;letter-spacing:1px;font-weight:700">🧠 ${r.cropped?'Riconosciuto su foto intera e pesce ritagliato':'Riconosciuto sul telefono'}</div>
    <div style="font-size:19px;font-weight:800;margin-top:2px">${esc(r.species)} <span class="pill" style="background:${col}22;color:${col}">${pick?'scelta da te':pc+'%'}</span></div>
    <div class="small mut">${pick?'':`<i>${esc(r.scientific_name)}</i>`}${!pick&&pc<40?' · poco sicuro, controlla le alternative':''}</div>
    ${r.alternatives?.length?`<div class="small" style="margin-top:6px">Oppure: ${r.alternatives.map(a=>`<span class="chip" style="padding:3px 9px;font-size:12px" onclick="aiPick('${target}','${esc(a.species).replace(/'/g,"\\'")}')">${esc(a.species)} ${Math.round(a.confidence*100)}%</span>`).join(' ')}</div>`:''}
    ${measBlock(st,target)}
  </div></div>`;
}
/* Sessione live */
let LIVEAI=null;
async function liveAnalyze(){
  if(!LIVEQ.photo)return;
  if(!(await modelReady())){LIVEAI={needModel:true};render();return;}
  LIVEAI={loading:true};render();
  try{
    const r=await classifyFish(LIVEQ.big||LIVEQ.photo,S.live?.mode||S.mode);LIVEAI={r};
    if(r.is_fish){LIVEQ.sp=r.species;LIVEQ.emb=r.emb;if(LIVEQ.l){const w=estW(r.species,LIVEQ.l);if(w)LIVEQ.w=String(Math.round(w*100)/100);}}
  }catch(e){LIVEAI={err:aiErrMsg(e)};}
  if(S.tab==='live')render();
}
/* Modulo uscita */
const ENTRYAI={};
async function entryAnalyze(i,big){
  const c=DRAFT.catches[i];if(!c?.photo)return;
  if(!(await modelReady())){ENTRYAI[i]={needModel:true};drawEntry();return;}
  ENTRYAI[i]={loading:true};drawEntry();
  if(big)c.big=big;
  try{const r=await classifyFish(big||c.photo,DRAFT.mode);ENTRYAI[i]={r};if(r.is_fish&&DRAFT.catches[i]===c){c.sp=r.species;c.emb=r.emb;}}
  catch(e){ENTRYAI[i]={err:aiErrMsg(e)};}
  if(document.getElementById('sheet').classList.contains('on')&&DRAFT&&!MEAS_OPEN())drawEntry();
}
const MEAS_OPEN=()=>!!document.getElementById('mcv');
function aiRetry(t){if(t==='live')liveAnalyze();else if(t==='assist')assistAnalyze();else entryAnalyze(+t);}
function aiPick(t,sp){
  if(t==='live'){LIVEQ.sp=sp;const w=LIVEQ.l?estW(sp,LIVEQ.l):null;if(w)LIVEQ.w=String(Math.round(w*100)/100);if(LIVEAI?.r){const r=LIVEAI.r;r.alternatives=[{species:r.species,confidence:r.confidence},...r.alternatives.filter(a=>a.species!==sp)].slice(0,3);r.confidence=null;r.species=sp;}render();}
  else if(t==='assist'){const r=ASSIST.st.r;r.alternatives=[{species:r.species,confidence:r.confidence},...r.alternatives.filter(a=>a.species!==sp)].slice(0,3);r.species=sp;r.confidence=null;render();}
  else{const c=DRAFT.catches[+t];c.sp=sp;const w=c.l?estW(sp,c.l):null;if(w)c.w=Math.round(w*100)/100;drawEntry();}
}
/* Assistente */
let ASSIST=null;
async function assistSnap(inp){const d=await readPhoto(inp);if(!d)return;ASSIST={photo:d,big:readPhoto.big};assistAnalyze();}
async function assistAnalyze(){
  if(!ASSIST)return;
  if(!(await modelReady())){ASSIST.st={needModel:true};render();return;}
  ASSIST.st={loading:true};render();
  try{ASSIST.st={r:await classifyFish(ASSIST.big||ASSIST.photo,S.mode)};}catch(e){ASSIST.st={err:aiErrMsg(e)};}
  if(S.tab==='pesce')render();
}
/* Impostazioni: stato del modello */
async function modelStatus(){
  const el=document.getElementById('mstat');if(!el)return;
  const ok=await modelReady();
  el.innerHTML=MODEL_DL?`<div class="dlb"><div id="dlbar" style="width:${(MODEL_DL.st.pct*100).toFixed(1)}%"></div></div><div class="small mut"><span id="dlpct">${Math.round(MODEL_DL.st.pct*100)}%</span> scaricato…</div>`
    :ok?`<div class="small" style="color:var(--ok)">● Modelli installati: specie, misura e peso automatici anche offline</div><button class="btn danger full" style="margin-top:10px" onclick="deleteModel()">Elimina modello</button>`
    :`<div class="small mut">○ Modelli non ancora scaricati</div><button class="btn full" style="margin-top:10px" onclick="downloadModel().then(()=>toast('Modello pronto!')).catch(e=>toast(aiErrMsg(e)))">⬇️ Scarica modelli (circa 155 MB)</button>`;
}

/* ===================== Sheet ===================== */
function openSheet(html){document.getElementById('sheetBox').innerHTML=html;document.getElementById('sheet').classList.add('on');}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}

(function(){const b=document.getElementById('bubbles');let h='';for(let i=0;i<14;i++){const z=4+Math.random()*12;h+=`<span class="bub" style="left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*16}s;animation-delay:${-Math.random()*20}s"></span>`;}b.innerHTML=h;})();
try{Object.keys(localStorage).filter(k=>k.startsWith('lenza.wx_')).forEach(k=>{const v=JSON.parse(localStorage.getItem(k));if(!v||Date.now()-v.ts>36*3600e3)localStorage.removeItem(k);});}catch(e){}
{const t=location.hash.slice(1);if(PAGES.includes(t))S.tab=t;}
// data e ora della versione pubblicata (inserite automaticamente da GitHub a ogni pubblicazione)
{const el=document.getElementById('ver'),b=el.dataset.build;const lm=new Date(document.lastModified),p2=n=>String(n).padStart(2,'0');
  // GitHub Pages a volte pubblica anche la copia senza data: in quel caso uso la data del file inviata dal server
  el.textContent='agg. '+(b.includes('BUILD')?`${p2(lm.getDate())}/${p2(lm.getMonth()+1)}/${lm.getFullYear()} ${p2(lm.getHours())}:${p2(lm.getMinutes())}`:b);}
buildProfile();
checkBadges();
render();
loadWeather();
if(!LS.get('welcomed',false))setTimeout(welcome,700);
// aggiornamento automatico: controlla sempre se c'è una versione nuova e ricarica appena è pronta
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update();});}).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded||S.live)return;reloaded=true;toast('Nuova versione di Lenza: ricarico…');setTimeout(()=>location.reload(),800);});
}
</script>
