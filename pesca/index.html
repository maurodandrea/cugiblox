<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071a2c">
<title>Lenza · Indice di Pesca</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030d1a; --bg2:#0a1f36; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.06); --line:rgba(255,255,255,.08);
    --txt:#f2f8ff; --mut:#8fa9c4; --acc:#2fe0cf; --acc-b:#3b8cff; --acc2:#ffb547; --bad:#ff6b7a; --ok:#5ee08a;
    --grad:linear-gradient(135deg,#2fe0cf 0%,#3b8cff 100%);
    --grad-warm:linear-gradient(135deg,#ffb547 0%,#ff6b7a 100%);
    --shadow:0 12px 32px -12px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.03) inset;
    --r:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{background:var(--bg);color:var(--txt);font:15px/1.45 'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  /* --- sfondo oceano animato --- */
  .ocean{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:radial-gradient(120% 70% at 50% -10%,#0f4a7a 0%,#082a4d 35%,#04152a 70%,#020a15 100%);}
  .ocean .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:drift 22s ease-in-out infinite alternate;}
  .ocean .b1{width:340px;height:340px;background:#1fc8c0;top:-80px;left:-90px;}
  .ocean .b2{width:300px;height:300px;background:#2a5cff;top:30%;right:-120px;animation-duration:28s;opacity:.3;}
  .ocean .b3{width:260px;height:260px;background:#0fb5a6;bottom:-80px;left:20%;animation-duration:32s;opacity:.25;}
  @keyframes drift{to{transform:translate(60px,80px) scale(1.15);}}
  .ocean .bub{position:absolute;bottom:-20px;border-radius:50%;border:1px solid rgba(180,240,255,.35);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);animation:rise linear infinite;}
  @keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(30px,-110vh);opacity:0}}
  .ocean .rays{position:absolute;inset:-20% -10% auto;height:70%;background:repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 40px,transparent 40px 110px);filter:blur(6px);animation:sway 12s ease-in-out infinite alternate;transform-origin:top;}
  @keyframes sway{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}

  #app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
    background:linear-gradient(180deg,rgba(3,13,26,.85),rgba(3,13,26,.55) 70%,rgba(3,13,26,0));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.3px;}
  .logo .mark{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px -4px rgba(47,224,207,.55);}
  .logo .mark svg{width:22px;height:22px;}
  .logo .word b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .spotchip{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;color:var(--txt);font:600 13px 'Outfit',sans-serif;cursor:pointer;max-width:58%;backdrop-filter:blur(10px);transition:.2s;}
  .spotchip:hover{background:rgba(255,255,255,.12);}
  .spotchip svg{width:16px;height:16px;flex:none;color:var(--acc);}
  .spotchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .modes{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 16px 0;padding:4px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);backdrop-filter:blur(10px);}
  .modes .slider{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px - 12px)/4);border-radius:14px;background:var(--grad);box-shadow:0 6px 18px -6px rgba(47,224,207,.7);transition:transform .35s cubic-bezier(.4,1.4,.5,1);}
  .mode{position:relative;z-index:1;border:0;background:none;color:var(--mut);border-radius:14px;padding:9px 4px;font:600 13px 'Outfit',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:color .25s;}
  .mode svg{width:17px;height:17px;}
  .mode.on{color:#032a2a;}
  main{flex:1;padding:14px 16px 120px;}
  /* --- nav flottante --- */
  nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;z-index:30;display:flex;padding:6px;gap:2px;
    background:rgba(8,24,44,.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:26px;box-shadow:0 18px 40px -10px rgba(0,0,0,.7);}
  nav button{flex:1;position:relative;background:none;border:0;color:var(--mut);padding:8px 0 7px;font:600 10.5px 'Outfit',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:20px;transition:color .2s,background .25s;}
  nav button svg{width:22px;height:22px;transition:transform .25s;}
  nav button.on{color:var(--acc);background:rgba(47,224,207,.12);}
  nav button.on svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px rgba(47,224,207,.6));}
  /* --- card --- */
  .card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  main>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both;}
  main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}main>*:nth-child(6){animation-delay:.25s}main>*:nth-child(n+7){animation-delay:.3s}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .card h3{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin-bottom:12px;font-weight:700;}
  .card h3::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--acc);}
  .row{display:flex;gap:10px;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .tile{position:relative;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:12px;}
  .tile .k{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;font-weight:600;}
  .tile .v{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.3px;}
  .tile .s{font-size:12px;color:var(--mut);}
  .mut{color:var(--mut);} .small{font-size:12px;}
  .btn{background:var(--grad);color:#03282a;border:0;border-radius:16px;padding:12px 16px;font:700 14px 'Outfit',sans-serif;cursor:pointer;box-shadow:0 10px 24px -10px rgba(47,224,207,.8);transition:transform .15s,box-shadow .2s;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);box-shadow:none;}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,122,.35);box-shadow:none;}
  .btn.full{width:100%;padding:15px;font-size:15px;}
  .banner{background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);color:#ffd79a;border-radius:16px;padding:10px 14px;font-size:13px;margin-bottom:14px;backdrop-filter:blur(10px);}
  /* --- hero --- */
  .hero{position:relative;overflow:hidden;border-radius:30px;padding:18px 18px 22px;margin-bottom:14px;border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 50px -18px rgba(0,0,0,.7);isolation:isolate;}
  .hero.sky-night{background:linear-gradient(170deg,#101d4a 0%,#0b2d5c 55%,#06345a 100%);}
  .hero.sky-dawn{background:linear-gradient(170deg,#ff9a76 0%,#c86dd7 38%,#3557c9 75%,#0b3f73 100%);}
  .hero.sky-day{background:linear-gradient(170deg,#3fb3ff 0%,#1b7fd6 45%,#0b4d8f 100%);}
  .hero.sky-dusk{background:linear-gradient(170deg,#ff7e5f 0%,#d1497a 35%,#5b3a9e 70%,#0d3466 100%);}
  .hero .stars{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 28%,#fff,transparent),radial-gradient(1px 1px at 10% 40%,#fff,transparent),radial-gradient(1px 1px at 60% 22%,#fff,transparent);opacity:.7;animation:tw 4s ease-in-out infinite alternate;}
  @keyframes tw{to{opacity:.25}}
  .hero .orb{position:absolute;z-index:-1;width:120px;height:120px;border-radius:50%;top:-30px;right:-20px;filter:blur(2px);}
  .sky-night .orb{background:radial-gradient(circle at 35% 35%,#fffbe8,#d9dcef 55%,rgba(217,220,239,0) 72%);opacity:.55;}
  .sky-day .orb,.sky-dawn .orb,.sky-dusk .orb{background:radial-gradient(circle,#fff6c9 0%,#ffd36b 35%,rgba(255,200,80,0) 70%);opacity:.8;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .hero-loc{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;}
  .hero-loc svg{width:16px;height:16px;}
  .hero-date{font-size:13px;opacity:.8;text-transform:capitalize;}
  .hero-wx{text-align:right;line-height:1;}
  .hero-wx .ic{font-size:30px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));}
  .hero-wx b{display:block;font-size:30px;font-weight:300;margin-top:2px;}
  .gauge-wrap{position:relative;width:236px;height:236px;margin:2px auto -14px;}
  .gauge-wrap svg{width:100%;height:100%;overflow:visible;}
  .gauge-arc{animation:arc 1.4s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes arc{from{stroke-dashoffset:100}}
  .gauge-knob{animation:fadein .4s 1.2s both;}
  @keyframes fadein{from{opacity:0}}
  .gauge-wrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px;}
  .gauge-wrap .num b{font-size:72px;line-height:.95;font-weight:800;letter-spacing:-3px;text-shadow:0 6px 30px rgba(0,0,0,.35);}
  .gauge-wrap .num span{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;font-weight:600;margin-top:4px;}
  .gauge-wrap .num .pill{margin-top:8px;font-size:13px;padding:4px 12px;text-transform:none;letter-spacing:0;}
  .hero-exp{text-align:center;font-size:13.5px;opacity:.92;margin:0 auto 14px;max-width:340px;}
  .hero-stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(0,10,30,.28);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:10px 4px;backdrop-filter:blur(8px);}
  .hero-stats div{text-align:center;}
  .hero-stats .ic{font-size:18px;height:22px;display:flex;align-items:center;justify-content:center;}
  .hero-stats .arrow{font-size:20px;color:#fff;}
  .hero-stats b{display:block;font-size:15px;margin-top:2px;}
  .hero-stats span{font-size:10.5px;opacity:.75;text-transform:uppercase;letter-spacing:.6px;}
  .hero .waves{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:-1;}
  .hero .waves use{animation:wave 7s linear infinite;}
  .hero .waves use:nth-child(2){animation-duration:11s;animation-direction:reverse;}
  .hero .waves use:nth-child(3){animation-duration:15s;}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-200px)}}
  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;}
  .pill.solid{color:#04211f;box-shadow:0 6px 16px -6px currentColor;}
  .ring-num{position:relative;width:44px;height:44px;margin:4px auto 2px;}
  .ring-num svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-num b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;}
  /* --- giorni --- */
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .day{flex:1;min-width:66px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:10px 4px;text-align:center;cursor:pointer;transition:.2s;}
  .day:hover{background:rgba(255,255,255,.09);}
  .day.on{background:linear-gradient(180deg,rgba(47,224,207,.22),rgba(59,140,255,.12));border-color:rgba(47,224,207,.6);box-shadow:0 8px 20px -10px rgba(47,224,207,.8);}
  .day .d{font-size:12px;color:var(--mut);text-transform:capitalize;font-weight:600;}
  .day.on .d{color:var(--txt);}
  .day .ic{font-size:22px;margin:2px 0;}
  /* --- finestre --- */
  .win{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);margin-top:8px;border:1px solid rgba(255,255,255,.05);}
  .win:first-of-type{margin-top:0;}
  .win .clock{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;}
  .win .t{flex:1;}
  .win .t b{font-size:17px;}
  .win .meter{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden;}
  .win .meter div{height:100%;border-radius:5px;}
  /* --- ore --- */
  .hours{display:flex;flex-direction:column;gap:4px;}
  .hr{display:grid;grid-template-columns:44px 26px 40px 1fr 54px 52px;align-items:center;gap:6px;padding:9px 8px;border-radius:14px;font-size:13px;}
  .hours .hr:nth-child(odd){background:rgba(255,255,255,.03);}
  .hr.now{background:linear-gradient(90deg,rgba(47,224,207,.18),rgba(47,224,207,.02))!important;box-shadow:inset 3px 0 0 var(--acc);}
  .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bar>div{height:100%;border-radius:6px;}
  .arrow{display:inline-block;color:var(--acc);font-weight:800;}
  .timeline{position:relative;height:38px;border-radius:12px;background:rgba(255,255,255,.05);overflow:hidden;}
  .timeline .seg{position:absolute;top:0;bottom:0;border-radius:6px;}
  .timeline .now{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff;}
  .tl-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:5px;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .moonbig{font-size:46px;line-height:1;filter:drop-shadow(0 0 16px rgba(255,250,220,.35));}
  /* --- mappa e liste --- */
  #map{height:52vh;min-height:300px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
  .pin{position:relative;width:30px;height:30px;}
  .pin i{position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--grad);border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.5);}
  .pin.off i{background:linear-gradient(135deg,#8fa9c4,#4b6684);}
  .pin.on::after{content:'';position:absolute;left:50%;top:100%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--acc);animation:ping 1.8s ease-out infinite;}
  @keyframes ping{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
  .list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .list .it:last-child{border-bottom:0;}
  .list .it .t{flex:1;min-width:0;cursor:pointer;}
  .list .it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ico{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,rgba(47,224,207,.2),rgba(59,140,255,.15));border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;overflow:hidden;}
  .ico img{width:100%;height:100%;object-fit:cover;}
  input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s;}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,224,207,.18);}
  select option{background:#0a1f36;}
  textarea{min-height:80px;resize:vertical;}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px;font-weight:600;letter-spacing:.3px;}
  .sheet{position:fixed;inset:0;z-index:1000;background:rgba(1,6,14,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;}
  .sheet.on{display:flex;animation:fadein .2s both;}
  .sheet .box{background:linear-gradient(180deg,#0e2a48,#081a2e);border:1px solid rgba(255,255,255,.1);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:sheetup .35s cubic-bezier(.2,.9,.2,1) both;}
  .sheet .box::before{content:'';display:block;width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto 14px;}
  @keyframes sheetup{from{transform:translateY(60px);opacity:0}}
  .sheet h2{font-size:21px;margin-bottom:4px;letter-spacing:-.3px;}
  .catch{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;}
  .chip.on{background:var(--grad);color:#03282a;border-color:transparent;font-weight:700;box-shadow:0 6px 14px -6px rgba(47,224,207,.8);}
  .hbars .r{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:8px 0;}
  .hbars .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hbars .bar{height:10px;}
  .hbars .bar div{background:var(--grad);animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
  @keyframes grow{from{transform:scaleX(0)}}
  .vbars{display:flex;align-items:flex-end;gap:3px;height:120px;}
  .vbars div{flex:1;background:linear-gradient(180deg,#2fe0cf,#3b8cff);border-radius:4px 4px 2px 2px;min-height:3px;animation:growy .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom;}
  @keyframes growy{from{transform:scaleY(0)}}
  .tip{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start;}
  .tip>span:first-child{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:17px;}
  .tip:last-child{border-bottom:0;}
  .species{display:flex;gap:12px;padding:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);border-radius:16px;margin-top:8px;}
  .stat-hero .v{font-size:28px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .empty{text-align:center;padding:40px 10px;color:var(--mut);}
  .empty div{font-size:54px;margin-bottom:10px;animation:bob 3s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
  /* --- loader galleggiante --- */
  .loader{display:flex;flex-direction:column;align-items:center;padding:70px 0 30px;color:var(--mut);}
  .loader svg{width:110px;height:110px;}
  .loader .bobber{animation:bobber 1.6s ease-in-out infinite;transform-origin:55px 60px;}
  .loader .rip{animation:rip 1.6s ease-out infinite;transform-origin:55px 72px;}
  .loader .rip.r2{animation-delay:.8s;}

/* ===================== Astronomia (Luna) ===================== */
const RAD=Math.PI/180;
function jd(date){return date.getTime()/86400000+2440587.5;}
function moonPos(date,lat,lon){
  const d=jd(date)-2451545.0;
  const L=(218.316+13.176396*d)*RAD, M=(134.963+13.064993*d)*RAD, F=(93.272+13.229350*d)*RAD;
  const l=L+6.289*RAD*Math.sin(M), b=5.128*RAD*Math.sin(F), e=23.4397*RAD;
  const ra=Math.atan2(Math.sin(l)*Math.cos(e)-Math.tan(b)*Math.sin(e),Math.cos(l));
  const dec=Math.asin(Math.sin(b)*Math.cos(e)+Math.cos(b)*Math.sin(e)*Math.sin(l));
  const lst=(280.16+360.9856235*d)*RAD+lon*RAD;
  const H=lst-ra, phi=lat*RAD;
  const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  return {alt:alt/RAD,H:((H/RAD)%360+360)%360,lon:l};
}
function moonPhase(date){
  const d=jd(date)-2451545.0;
  const Ms=(357.5291+0.98560028*d)*RAD;
  const sunLon=Ms+(1.9148*Math.sin(Ms)+0.02*Math.sin(2*Ms))*RAD+(102.9372+180)*RAD;
  const ml=moonPos(date,0,0).lon;
  let ph=((ml-sunLon)/RAD)%360; if(ph<0)ph+=360;
  const illum=(1-Math.cos(ph*RAD))/2;
  const names=['Luna nuova','Luna crescente','Primo quarto','Gibbosa crescente','Luna piena','Gibbosa calante','Ultimo quarto','Luna calante'];
  const emo=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  const i=Math.round(ph/45)%8;
  return {angle:ph,illum,age:ph/360*29.53,name:names[i],e:emo[i]};
}
/* Periodi solunari: maggiori = transito/antitransito lunare (±1h), minori = sorgere/tramonto (±30 min) */
function solunar(dayStart,lat,lon){
  const out=[];let prev=null;
  for(let m=-90;m<=24*60+90;m+=5){
    const t=new Date(dayStart.getTime()+m*60000), p=moonPos(t,lat,lon);
    if(prev){
      const hd=((p.H-prev.p.H+540)%360)-180;
      if(prev.p.H>300&&p.H<60) out.push({type:'major',t:interp(prev,{t,p},'H0'),k:'Transito'});
      else if(prev.p.H<180&&p.H>=180&&hd>0) out.push({type:'major',t:interp(prev,{t,p},'H180'),k:'Antitransito'});
      if(prev.p.alt<0&&p.alt>=0) out.push({type:'minor',t:interp(prev,{t,p},'alt'),k:'Sorge la luna'});
      if(prev.p.alt>=0&&p.alt<0) out.push({type:'minor',t:interp(prev,{t,p},'alt'),k:'Tramonta la luna'});
    }
    prev={t,p};
  }
  function interp(a,b,kind){
    let va,vb;
    if(kind==='alt'){va=a.p.alt;vb=b.p.alt;}
    else if(kind==='H0'){va=a.p.H-360;vb=b.p.H;}
    else {va=a.p.H-180;vb=b.p.H-180;}
    const f=va===vb?0:-va/(vb-va);
    return new Date(a.t.getTime()+f*(b.t-a.t));
  }
  return out.map(x=>({...x,from:new Date(x.t.getTime()-(x.type==='major'?60:30)*60000),to:new Date(x.t.getTime()+(x.type==='major'?60:30)*60000)}))
            .filter(x=>x.to>dayStart&&x.from<new Date(dayStart.getTime()+86400000));
}

async function loadWeather(force){

  S.loading=true;render();

  const mu=`https://marine-api.open-meteo.com/v1/marine?latitude=${sp.lat}&longitude=${sp.lon}&hourly=wave_height,wave_direction,wave_period,sea_surface_temperature,sea_level_height_msl${tz}`;

/* Dati di riserva quando il servizio meteo non risponde */
function simulate(sp){
  const t0=new Date();t0.setHours(0,0,0,0);t0.setDate(t0.getDate()-1);
  const H={time:[],temperature_2m:[],relative_humidity_2m:[],pressure_msl:[],wind_speed_10m:[],wind_direction_10m:[],wind_gusts_10m:[],cloud_cover:[],precipitation:[],weather_code:[]};
  const D={time:[],sunrise:[],sunset:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[]};
  const doy=d=>Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  for(let i=0;i<24*8;i++){
    const t=new Date(t0.getTime()+i*3600e3),h=t.getHours(),k=i/24;
    const seas=Math.cos((doy(t)-200)/365*2*Math.PI);
    const tmp=14+8*seas+4*Math.sin((h-9)/24*2*Math.PI)+2*Math.sin(k*1.3);
    const ws=10+8*Math.sin(k*1.7+1)+4*Math.sin(h/24*2*Math.PI);
    const cc=clamp(50+45*Math.sin(k*1.1),0,100);
    H.time.push(isoLocal(t));H.temperature_2m.push(tmp);H.relative_humidity_2m.push(65+15*Math.sin(k));
    H.pressure_msl.push(1014+6*Math.sin(k*0.9));H.wind_speed_10m.push(Math.max(1,ws));H.wind_direction_10m.push((200+120*Math.sin(k*0.8)+360)%360);
    H.wind_gusts_10m.push(Math.max(2,ws*1.5));H.cloud_cover.push(cc);H.precipitation.push(cc>88?0.6:0);H.weather_code.push(cc>88?61:cc>70?3:cc>40?2:cc>15?1:0);
  }
  for(let d=0;d<8;d++){
    const t=new Date(t0.getTime()+d*864e5),sr=new Date(t),ss=new Date(t);
    const seas=Math.cos((doy(t)-172)/365*2*Math.PI);
    sr.setHours(6,10-Math.round(seas*75));ss.setHours(18,5+Math.round(seas*75));
    D.time.push(isoLocal(t).slice(0,10));D.sunrise.push(isoLocal(sr));D.sunset.push(isoLocal(ss));
    const sl=H.temperature_2m.slice(d*24,d*24+24);D.temperature_2m_max.push(Math.max(...sl));D.temperature_2m_min.push(Math.min(...sl));
    D.weather_code.push(H.weather_code[d*24+13]);
  }
  return {hourly:H,daily:D};
}
function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function parseLocal(s){const [a,b='00:00']=s.split('T');const [y,mo,da]=a.split('-').map(Number);const [h,mi]=b.split(':').map(Number);return new Date(y,mo-1,da,h,mi);}

function build(w,m,sp){
  const H=w.hourly,hours=[],mIdx={};
  if(m&&m.hourly) m.hourly.time.forEach((t,i)=>mIdx[t]=i);
  for(let i=0;i<H.time.length;i++){
    const t=H.time[i],mi=mIdx[t];
    hours.push({
      t:parseLocal(t),iso:t,temp:H.temperature_2m[i],hum:H.relative_humidity_2m?.[i],p:H.pressure_msl[i],
      ws:H.wind_speed_10m[i],wd:H.wind_direction_10m[i],wg:H.wind_gusts_10m[i],cc:H.cloud_cover[i],pr:H.precipitation[i],code:H.weather_code[i],
      wave:mi!=null?m.hourly.wave_height[mi]:null,wper:mi!=null?m.hourly.wave_period[mi]:null,wdir:mi!=null?m.hourly.wave_direction[mi]:null,
      sst:mi!=null?m.hourly.sea_surface_temperature[mi]:null,lvl:mi!=null?m.hourly.sea_level_height_msl?.[mi]:null
    });
  }
  const days=w.daily.time.map((d,i)=>({date:parseLocal(d),sr:parseLocal(w.daily.sunrise[i]),ss:parseLocal(w.daily.sunset[i]),code:w.daily.weather_code[i],tmax:w.daily.temperature_2m_max[i],tmin:w.daily.temperature_2m_min[i]}));
  const sol={};days.forEach(d=>{sol[d.date.toDateString()]=solunar(d.date,sp.lat,sp.lon);});
  const X={hours,days,sol,marine:!!m};
  hours.forEach((h,i)=>{h.idx=fishIndex(X,i,S.mode);});
  const today=new Date();today.setHours(0,0,0,0);
  X.fdays=days.filter(d=>d.date>=today).slice(0,7);
  return X;
}

/* ===================== Indice di Pesca ===================== */
const WEIGHTS={
  coast:{press:16,wind:12,wave:20,sol:14,moon:8,light:14,cloud:5,rain:5,sst:6},
  sea:{press:16,wind:20,wave:18,sol:14,moon:8,light:12,cloud:4,rain:4,sst:4},
  lake:{press:24,wind:12,wave:0,sol:16,moon:8,light:18,cloud:10,rain:8,sst:4},
  river:{press:20,wind:8,wave:0,sol:12,moon:6,light:18,cloud:10,rain:20,sst:6}
};
function factors(X,i,mode){
  const h=X.hours[i],f={};
  const prev=X.hours[Math.max(0,i-3)],dp=h.p-prev.p; h.dp=dp;
  f.press= dp<-3?.45: dp<-0.6?1: dp<=0.6?.8: dp<=2?.6:.4;
  if(h.p<1000||h.p>1028) f.press*=.8;
  const ws=h.ws;
  if(mode==='coast') f.wind= ws<4?.55: ws<=22?1: ws<=32?.6: ws<=45?.3:.1;
  else if(mode==='sea') f.wind= ws<=10?1: ws<=18?.75: ws<=28?.35:.05;
  else if(mode==='lake') f.wind= ws<3?.6: ws<=15?1: ws<=25?.6:.3;
  else f.wind= ws<=20?1: ws<=35?.6:.3;
  if(h.wave==null) f.wave=null;
  else if(mode==='coast') f.wave= h.wave<0.15?.45: h.wave<0.4?.75: h.wave<=1.3?1: h.wave<=2?.55:.2;
  else f.wave= h.wave<=0.5?1: h.wave<=1?.75: h.wave<=1.6?.35:.05;
  const day=X.sol[new Date(h.t.getFullYear(),h.t.getMonth(),h.t.getDate()).toDateString()]||[];
  const mid=new Date(h.t.getTime()+30*60000);
  f.sol=.35;
  for(const s of day){
    if(mid>=s.from&&mid<=s.to) f.sol=Math.max(f.sol,s.type==='major'?1:.75);
    else { const dist=Math.min(Math.abs(mid-s.from),Math.abs(mid-s.to))/60000; if(dist<60) f.sol=Math.max(f.sol,.55); }
  }
  const ph=moonPhase(h.t); const nearSyz=Math.min(ph.angle,Math.abs(ph.angle-180),360-ph.angle);
  f.moon=1-nearSyz/90*0.5; f.moon=clamp(f.moon,.5,1);
  const D=X.days.find(d=>d.date.toDateString()===new Date(h.t.getFullYear(),h.t.getMonth(),h.t.getDate()).toDateString());
  if(D){
    const tm=mid.getTime(),sr=D.sr.getTime(),ss=D.ss.getTime();
    const near=Math.min(Math.abs(tm-sr),Math.abs(tm-ss))/3600e3;
    if(near<=1.5) f.light=1;
    else if(tm<sr||tm>ss) f.light= mode==='coast'?.8: mode==='sea'?.55:.6;
    else { const midday=Math.abs(tm-(sr+ss)/2)/3600e3; f.light= midday<2?.45:.65; }
  } else f.light=.6;
  const dayT=D&&mid>D.sr&&mid<D.ss;
  f.cloud= !dayT?.75: h.cc>=70?.95: h.cc>=30?.8:.55;
  f.rain= h.pr<=0?.8: h.pr<1?1: h.pr<4?.55:.2;
  if(mode==='river'&&h.pr>=4) f.rain=.1;
  if([95,96,99].includes(h.code)) f.rain=0;
  if(h.sst!=null) f.sst= h.sst<11?.4: h.sst<14?.7: h.sst<=24?1: h.sst<=27?.75:.55;
  else { const tt=h.temp; f.sst= tt<4?.4: tt<10?.65: tt<=26?.95:.7; }
  if(X.hours[i].lvl!=null&&i>0&&i<X.hours.length-1){
    const a=X.hours[i-1].lvl,b=X.hours[i+1].lvl;
    if(a!=null&&b!=null){f.tide=clamp(.55+Math.abs(b-a)*6,.55,1);}
  }
  return f;
}
function fishIndex(X,i,mode){
  const f=factors(X,i,mode),W=WEIGHTS[mode];let s=0,tw=0;
  for(const k in W){ if(!W[k]||f[k]==null) continue; s+=W[k]*f[k]; tw+=W[k]; }
  if(f.tide!=null&&(mode==='coast'||mode==='sea')){ s+=6*f.tide; tw+=6; }
  let v=tw?s/tw*100:0;
  v+=personalBoost(X.hours[i],f,mode);
  X.hours[i].f=f;
  return clamp(Math.round(v),0,100);
}
/* Apprendimento dalle abitudini: confronta le condizioni con quelle delle uscite fruttuose del diario */
let PROFILE=null;
function buildProfile(){
  const ok=S.diary.filter(e=>e.cond&&e.catches&&e.catches.length);
  if(ok.length<3){PROFILE=null;return;}
  const avg=k=>{const v=ok.map(e=>e.cond[k]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const hrs=new Array(24).fill(0);ok.forEach(e=>{const h=new Date(e.start).getHours();hrs[h]++;hrs[(h+1)%24]+=.5;hrs[(h+23)%24]+=.5;});
  PROFILE={n:ok.length,ws:avg('ws'),wave:avg('wave'),dp:avg('dp'),illum:avg('illum'),hrs,max:Math.max(...hrs)};
}
function personalBoost(h,f,mode){
  if(!PROFILE) return 0;
  let sim=0,n=0;
  if(PROFILE.ws!=null){sim+=1-clamp(Math.abs(h.ws-PROFILE.ws)/15,0,1);n++;}
  if(PROFILE.wave!=null&&h.wave!=null){sim+=1-clamp(Math.abs(h.wave-PROFILE.wave)/1,0,1);n++;}
  if(PROFILE.dp!=null&&h.dp!=null){sim+=1-clamp(Math.abs(h.dp-PROFILE.dp)/3,0,1);n++;}
  sim+=PROFILE.hrs[h.t.getHours()]/PROFILE.max;n++;
  const conf=Math.min(1,PROFILE.n/10);
  return (sim/n-.5)*20*conf;
}
function idxLabel(v){return v>=85?['Eccellente','#2fd4c4']:v>=70?['Ottimo','#5ee08a']:v>=50?['Buono','#c6e05e']:v>=30?['Discreto','#ffb547']:['Scarso','#ff6b6b'];}
function idxColor(v){return idxLabel(v)[1];}
function dayHours(X,date){const ds=date.toDateString();return X.hours.filter(h=>h.t.toDateString()===ds);}
function dayScore(X,date){
  const hs=dayHours(X,date);if(!hs.length)return 0;
  const top=hs.map(h=>h.idx).sort((a,b)=>b-a).slice(0,6);
  return Math.round(top.reduce((a,b)=>a+b,0)/top.length);
}
function bestWindows(X,date,n=3){
  const now=new Date();
  const hs=dayHours(X,date).filter(h=>h.t.getTime()+3600e3>now.getTime()||date.toDateString()!==now.toDateString());
  const wins=[];let cur=null;
  const thr=Math.max(50,Math.max(...hs.map(h=>h.idx),0)-12);
  hs.forEach(h=>{
    if(h.idx>=thr){ if(!cur)cur={from:h.t,to:new Date(h.t.getTime()+3600e3),sum:h.idx,n:1,max:h.idx}; else {cur.to=new Date(h.t.getTime()+3600e3);cur.sum+=h.idx;cur.n++;cur.max=Math.max(cur.max,h.idx);} }
    else if(cur){wins.push(cur);cur=null;}
  });
  if(cur)wins.push(cur);
  return wins.sort((a,b)=>b.max-a.max||b.n-a.n).slice(0,n).sort((a,b)=>a.from-b.from);
}

function seaState(w){return w<0.1?'calmo':w<0.5?'poco mosso':w<1.25?'mosso':w<2.5?'molto mosso':w<4?'agitato':'grosso';}
function explain(h){
  const f=h.f||{},good=[],bad=[];
  const L={press:'pressione',wind:'vento',wave:'moto ondoso',sol:'periodo solunare',moon:'fase lunare',light:'luce',cloud:'nuvolosità',rain:'pioggia',sst:'temperatura',tide:'marea'};
  for(const k in L){if(f[k]==null)continue;if(f[k]>=.95)good.push(L[k]);else if(f[k]<=.45)bad.push(L[k]);}
  let s='';
  if(good.length)s+='A favore: '+good.slice(0,3).join(', ')+'. ';
  if(bad.length)s+='Contro: '+bad.slice(0,3).join(', ')+'.';
  return s||'Condizioni nella media.';
}
function timeline(sol,D){
  const day0=D?new Date(D.date):new Date();day0.setHours(0,0,0,0);
  const pct=t=>clamp((t-day0)/864e5*100,0,100);
  let seg='';
  if(D){[D.sr,D.ss].forEach(t=>{const a=pct(new Date(t.getTime()-3600e3)),b=pct(new Date(t.getTime()+3600e3));seg+=`<div class="seg" style="left:${a}%;width:${b-a}%;background:#ffb54755"></div>`;});}
  sol.forEach(s=>{const a=pct(s.from),b=pct(s.to);seg+=`<div class="seg" style="left:${a}%;width:${b-a}%;background:${s.type==='major'?'var(--acc)':'#2fd4c466'}"></div>`;});
  const now=new Date(),np=(now-day0)/864e5*100;
  if(np>=0&&np<=100)seg+=`<div class="now" style="left:${np}%"></div>`;
  return `<div class="timeline">${seg}</div><div class="tl-lbl"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`;
}

function var_(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function lineChart(vals,unit,col){
  const W=500,H=120,p=24,v=vals.filter(x=>x!=null);if(!v.length)return '';
  const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  const pts=vals.map((x,i)=>x==null?null:[p+i*(W-2*p)/(vals.length-1||1),H-p-(x-mn)/rg*(H-2*p)]).filter(Boolean);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5"/>
    <text x="${p}" y="12" fill="#93b0cc" font-size="11">max ${fmt1(mx)} ${unit}</text><text x="${p}" y="${H-4}" fill="#93b0cc" font-size="11">min ${fmt1(mn)} ${unit}</text></svg>`;
}
function smooth(pts){
  if(pts.length<2)return '';let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`;}
  return d;
}
function chart(hs){
  const W=500,H=170,p=22,n=hs.length;if(!n)return '';
  const x=i=>p+i*(W-2*p)/(n-1||1),y=v=>H-p-v*(H-2*p-10);
  const wmx=Math.max(30,...hs.map(h=>h.ws));
  const ip=hs.map((h,i)=>[x(i),y(h.idx/100)]),wp=hs.map((h,i)=>[x(i),y(h.ws/wmx)]);
  const line=smooth(ip),area=line+` L${x(n-1)} ${H-p} L${x(0)} ${H-p}Z`;
  const best=hs.reduce((a,h,i)=>h.idx>hs[a].idx?i:a,0);
  const grid=[.25,.5,.75,1].map(k=>`<line x1="${p}" x2="${W-p}" y1="${y(k)}" y2="${y(k)}" stroke="rgba(255,255,255,.06)"/>`).join('');
  const lbl=[0,6,12,18,23].filter(i=>i<n).map(i=>`<text x="${x(i)}" y="${H-4}" fill="#8fa9c4" font-size="11" text-anchor="middle">${pad(hs[i].t.getHours())}:00</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fe0cf" stop-opacity=".55"/><stop offset="1" stop-color="#3b8cff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2fe0cf"/><stop offset="1" stop-color="#3b8cff"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ar)"/><path d="${line}" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linecap="round"/>
    <path d="${smooth(wp)}" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="5 5" opacity=".9"/>
    <circle cx="${ip[best][0]}" cy="${ip[best][1]}" r="11" fill="#2fe0cf" opacity=".25"/><circle cx="${ip[best][0]}" cy="${ip[best][1]}" r="5" fill="#fff" stroke="#2fe0cf" stroke-width="3"/>
    <text x="${clamp(ip[best][0],30,W-30)}" y="${ip[best][1]-16}" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${hs[best].idx} · ${pad(hs[best].t.getHours())}:00</text>${lbl}</svg>
  <div class="legend"><span><i style="background:var(--grad)"></i>Indice di pesca</span><span><i style="background:#ffb547"></i>Vento (max ${fmt0(wmx)} km/h)</span></div>`;
}

function initMap(){
  if(typeof L==='undefined'){document.getElementById('map').innerHTML='<div class="empty"><div>🗺️</div>Mappa non disponibile offline</div>';return;}
  const sp=activeSpot()||{lat:42,lon:12.5};
  MAP=L.map('map',{zoomControl:true}).setView([sp.lat,sp.lon],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
  S.spots.forEach(s=>{
    const ic=L.divIcon({html:`<div class="pin ${s.id===S.active?'on':'off'}"><i></i></div>`,className:'',iconSize:[30,30],iconAnchor:[15,36],popupAnchor:[0,-34]});
    L.marker([s.lat,s.lon],{icon:ic}).addTo(MAP).bindPopup(`<b>${esc(s.name)}</b><br>${MODES[s.mode]?.n||''}<br><a href="#" onclick="useSpot('${s.id}');return false">Imposta come attivo</a>`);
  });
  MAP.on('click',e=>editSpot(null,e.latlng.lat,e.latlng.lng));
}
function useSpot(id){S.active=id;LS.set('active',id);const sp=activeSpot();if(sp.mode&&sp.mode!==S.mode){S.mode=sp.mode;LS.set('mode',sp.mode);}S.wx=null;loadWeather();toast('Spot attivo: '+sp.name);go('home');}
function editSpot(id,lat,lon){
  const s=id?S.spots.find(x=>x.id===id):{name:'',lat,lon,mode:S.mode,note:''};
  openSheet(`<h2>${id?'Modifica spot':'Nuovo spot'}</h2><p class="small mut">${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}</p>
    <label>Nome</label><input id="spN" value="${esc(s.name)}" placeholder="Es. Scogliera del faro">
    <label>Tipo</label><select id="spM">${Object.entries(MODES).map(([k,m])=>`<option value="${k}" ${s.mode===k?'selected':''}>${m.e} ${m.n} – ${m.d}</option>`).join('')}</select>
    <label>Note</label><textarea id="spT" placeholder="Fondale, accesso, esche che funzionano…">${esc(s.note)}</textarea>
    <div class="row" style="margin-top:14px">${id?`<button class="btn danger" onclick="delSpot('${id}')">Elimina</button>`:''}<button class="btn ghost" style="margin-left:auto" onclick="closeSheet()">Annulla</button><button class="btn" onclick="saveSpot('${id||''}',${s.lat},${s.lon})">Salva</button></div>`);
}
function saveSpot(id,lat,lon){
  const name=document.getElementById('spN').value.trim()||'Spot senza nome',mode=document.getElementById('spM').value,note=document.getElementById('spT').value.trim();
  if(id){Object.assign(S.spots.find(s=>s.id===id),{name,mode,note});}
  else{const s={id:uid(),name,lat,lon,mode,note};S.spots.push(s);if(S.spots.length===1)S.active=s.id;}
  LS.set('spots',S.spots);LS.set('active',S.active);closeSheet();toast('Spot salvato');render();
}
function delSpot(id){
  if(!confirm('Eliminare questo spot? Le uscite del diario restano salvate.'))return;
  S.spots=S.spots.filter(s=>s.id!==id);if(S.active===id){S.active=S.spots[0]?.id||null;S.wx=null;if(S.active)loadWeather();}
  LS.set('spots',S.spots);LS.set('active',S.active);closeSheet();render();
}
async function searchPlace(){
  const q=document.getElementById('q').value.trim();if(!q)return;
  const res=document.getElementById('res');res.innerHTML='<p class="mut small">Cerco…</p>';
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=it`);const j=await r.json();
    if(!j.results||!j.results.length){res.innerHTML='<p class="mut small">Nessun risultato.</p>';return;}
    res.innerHTML='<div class="card list">'+j.results.map(p=>`<div class="it" onclick="MAP&&MAP.setView([${p.latitude},${p.longitude}],13);document.getElementById('res').innerHTML=''"><div class="ico">📍</div><div class="t"><b>${esc(p.name)}</b><span class="small mut">${esc([p.admin1,p.country].filter(Boolean).join(', '))}</span></div></div>`).join('')+'</div>';
  }catch(e){res.innerHTML='<p class="mut small">Ricerca non disponibile.</p>';}
}
function locateMe(){
  if(!navigator.geolocation){toast('Geolocalizzazione non disponibile');return;}
  navigator.geolocation.getCurrentPosition(p=>{MAP&&MAP.setView([p.coords.latitude,p.coords.longitude],14);editSpot(null,p.coords.latitude,p.coords.longitude);},()=>toast('Posizione non disponibile'),{enableHighAccuracy:true,timeout:10000});
}

  <button class="btn ghost full" style="margin-top:8px" onclick="DRAFT.catches.push({sp:'',w:'',l:'',rel:false});drawEntry()">＋ Aggiungi cattura</button>
  <label>Foto</label>${e.photo?`<img src="${e.photo}" style="max-width:100%;border-radius:12px;margin-bottom:6px"><br><span class="small" style="color:var(--bad);cursor:pointer" onclick="DRAFT.photo=null;drawEntry()">Rimuovi foto</span>`:`<input type="file" accept="image/*" onchange="pickPhoto(this)">`}
  <label>Note</label><textarea onchange="DRAFT.note=this.value" placeholder="Com'è andata?">${esc(e.note)}</textarea>
  ${e.cond?`<p class="small mut" style="margin-top:8px">Condizioni registrate: vento ${fmt0(e.cond.ws)} km/h, ${e.cond.wave!=null?'onda '+fmt1(e.cond.wave)+' m, ':''}pressione ${fmt0(e.cond.p)} hPa, ${esc(e.cond.moon||'')}</p>`:''}
  <div class="row" style="margin-top:14px">${e.id?`<button class="btn danger" onclick="delEntry('${e.id}')">Elimina</button>`:''}<button class="btn ghost" style="margin-left:auto" onclick="closeSheet()">Annulla</button><button class="btn" onclick="saveEntry()">Salva</button></div>`);
}
function sizeWarn(c){
  const s=SPECIES.find(x=>x.n.toLowerCase()===String(c.sp).toLowerCase());
  if(s&&s.sz&&c.l&&+c.l<s.sz&&!c.rel) return `<div class="small" style="color:var(--acc2);margin-top:4px">⚠️ Sotto la misura minima indicativa (${s.sz} cm): va rilasciato.</div>`;
  return '';
}
function pickPhoto(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);DRAFT.photo=c.toDataURL('image/jpeg',.7);drawEntry();};img.src=r.result;};
  r.readAsDataURL(f);
}
function snapshot(e){
  const st=parseLocal(e.start),ph=moonPhase(st),sp=S.spots.find(s=>s.id===e.spot);
  const cond={moon:ph.name,illum:ph.illum};
  if(S.wx&&sp&&sp.id===S.active){
    const h=S.wx.hours.find(x=>Math.abs(x.t-st)<1800e3)||S.wx.hours.find(x=>x.t<=st&&x.t.getTime()+3600e3>st);
    if(h)Object.assign(cond,{ws:h.ws,wd:h.wd,wave:h.wave,p:h.p,dp:h.dp,temp:h.temp,sst:h.sst,cc:h.cc,idx:h.idx});
  }
  return cond;
}
function saveEntry(){
  const e=DRAFT;e.catches=e.catches.filter(c=>c.sp&&c.sp.trim());
  e.catches.forEach(c=>{c.w=c.w===''?null:+c.w;c.l=c.l===''?null:+c.l;});
  if(!e.id){e.id=uid();e.cond=snapshot(e);S.diary.push(e);}
  else{const old=S.diary.find(x=>x.id===e.id);if(old.start!==e.start||!old.cond||old.cond.ws==null)e.cond=snapshot(e);Object.assign(old,e);}
  if(!LS.set('diary',S.diary)){S.diary=LS.get('diary',[]);return;}
  buildProfile();loadWeather();
  closeSheet();toast('Uscita salvata');go('diario');
}
function delEntry(id){if(!confirm('Eliminare questa uscita?'))return;S.diary=S.diary.filter(e=>e.id!==id);LS.set('diary',S.diary);buildProfile();closeSheet();render();}

/* ===================== Statistiche ===================== */
function vStats(v){
  const D=S.diary;
  if(!D.length){v.innerHTML='<div class="empty"><div>📊</div>Nessun dato ancora.<br>Registra le tue uscite nel diario per vedere le statistiche.</div>';return;}
  const all=D.flatMap(e=>(e.catches||[]).map(c=>({...c,e})));
  const kg=all.reduce((a,c)=>a+(+c.w||0),0),ok=D.filter(e=>e.catches?.length).length;
  const big=all.filter(c=>c.w).sort((a,b)=>b.w-a.w)[0];
  const hours=D.reduce((a,e)=>a+Math.max(0,(parseLocal(e.end)-parseLocal(e.start))/3600e3),0);
  const count=(arr,key)=>{const m={};arr.forEach(x=>{const k=key(x);if(k)m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const bySp=count(all,c=>c.sp),byTech=count(all,c=>c.e.tech),bySpot=count(all,c=>S.spots.find(s=>s.id===c.e.spot)?.name||'Spot eliminato'),byMoon=count(all,c=>c.e.cond?.moon);
  const hrs=new Array(24).fill(0);all.forEach(c=>hrs[new Date(c.e.start).getHours()]++);const hmx=Math.max(1,...hrs);
  const rate=D.map(e=>({e,r:(e.catches?.length||0)/Math.max(.5,(parseLocal(e.end)-parseLocal(e.start))/3600e3)}));
  const avgOf=(arr,k)=>{const v=arr.map(e=>e.cond?.[k]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const okE=D.filter(e=>e.catches?.length),noE=D.filter(e=>!e.catches?.length);
  const hb=(rows)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return '<div class="hbars">'+rows.slice(0,6).map(r=>`<div class="r"><span>${esc(r[0])}</span><div class="bar"><div style="width:${r[1]/mx*100}%;background:var(--acc)"></div></div><b>${r[1]}</b></div>`).join('')+'</div>';};
  v.innerHTML=`
  <div class="grid2 stat-hero" style="margin-bottom:14px">
    <div class="tile"><div class="k">Uscite</div><div class="v">${D.length}</div><div class="s">${fmt0(hours)} ore in pesca</div></div>
    <div class="tile"><div class="k">Catture</div><div class="v">${all.length}</div><div class="s">${fmt1(all.length/Math.max(1,hours))} / ora</div></div>
    <div class="tile"><div class="k">Peso totale</div><div class="v">${fmt1(kg)} kg</div><div class="s">${all.filter(c=>c.rel).length} rilasciati</div></div>
    <div class="tile"><div class="k">Uscite fruttuose</div><div class="v">${Math.round(ok/D.length*100)}%</div><div class="s">${ok} su ${D.length}</div></div>
  </div>
  ${big?`<div class="card"><h3>🏆 Cattura record</h3><b>${esc(big.sp)}</b> · ${fmt1(big.w)} kg${big.l?` · ${big.l} cm`:''}<div class="small mut">${new Date(big.e.start).toLocaleDateString('it-IT')} · ${esc(S.spots.find(s=>s.id===big.e.spot)?.name||'')} · ${esc(big.e.tech||'')}</div></div>`:''}
  ${bySp.length?`<div class="card"><h3>Specie</h3>${hb(bySp)}</div>`:''}
  <div class="card"><h3>Catture per ora di inizio</h3><div class="vbars">${hrs.map(x=>`<div style="height:${x/hmx*100}%;opacity:${x?1:.25}"></div>`).join('')}</div><div class="tl-lbl"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>
  ${byTech.length?`<div class="card"><h3>Tecniche</h3>${hb(byTech)}</div>`:''}
  ${bySpot.length?`<div class="card"><h3>Spot più produttivi</h3>${hb(bySpot)}</div>`:''}
  ${byMoon.length?`<div class="card"><h3>Fase lunare</h3>${hb(byMoon)}</div>`:''}
  ${okE.length&&noE.length?`<div class="card"><h3>Condizioni: fruttuose vs cappotto</h3>
    <div class="hr mut small" style="grid-template-columns:1fr 80px 80px"><span></span><b>🐟 Sì</b><b>🚫 No</b></div>
    ${[['Vento km/h','ws',fmt0],['Onda m','wave',fmt1],['Pressione hPa','p',fmt0],['Δ pressione 3h','dp',fmt1],['Indice','idx',fmt0]].map(([n,k,f])=>`<div class="hr" style="grid-template-columns:1fr 80px 80px"><span>${n}</span><b>${f(avgOf(okE,k))}</b><span>${f(avgOf(noE,k))}</span></div>`).join('')}</div>`:''}
  <div class="row" style="gap:8px"><button class="btn ghost" style="flex:1" onclick="exportData()">⬇️ Esporta backup</button><label class="btn ghost" style="flex:1;text-align:center;margin:0;color:var(--txt);font-size:14px">⬆️ Importa<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div>`;
}
function exportData(){
  const b=new Blob([JSON.stringify({v:1,spots:S.spots,diary:S.diary},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lenza-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.spots)||!Array.isArray(j.diary))throw 0;
    if(!confirm(`Importare ${j.spots.length} spot e ${j.diary.length} uscite? I dati attuali verranno sostituiti.`))return;
    S.spots=j.spots;S.diary=j.diary;S.active=S.spots[0]?.id||null;LS.set('spots',S.spots);LS.set('diary',S.diary);LS.set('active',S.active);buildProfile();S.wx=null;loadWeather();toast('Backup importato');render();}
    catch(e){toast('File non valido');}};
  r.readAsText(f);
}

/* ===================== Assistente ===================== */
let AIQ={sh:null,c:null,t:[]};
function vAI(v){
  const now=new Date(),mo=now.getMonth()+1,X=S.wx;
  const inSeason=SPECIES.filter(s=>s.m.includes(S.mode)&&s.mo.includes(mo));
  const tips=advice();
  const shapes=['affusolato','alto','allungato','cefalopode'],cols=['argento','dorato','rosso','blu','verde','marrone'];
  const traits=[...new Set(SPECIES.flatMap(s=>s.t))].sort();
  const cand=SPECIES.map(s=>{let sc=0;if(AIQ.sh&&s.sh===AIQ.sh)sc+=2;if(AIQ.c&&s.c===AIQ.c)sc+=2;AIQ.t.forEach(t=>{if(s.t.includes(t))sc+=3;});if(s.m.includes(S.mode))sc+=.5;return {s,sc};})
    .filter(x=>x.sc>.5).sort((a,b)=>b.sc-a.sc).slice(0,4);
  v.innerHTML=`
  <div class="card"><h3>🤖 Consigli per ${MODES[S.mode].n}${X?' · ora':''}</h3>${tips.map(t=>`<div class="tip"><span>${t[0]}</span><span>${t[1]}</span></div>`).join('')}</div>
  <div class="card"><h3>In stagione a ${now.toLocaleDateString('it-IT',{month:'long'})}</h3>
    ${inSeason.length?inSeason.map(s=>`<div class="species"><div class="ico">🐟</div><div><b>${s.n}</b> <i class="small mut">${s.s}</i><div class="small">🪱 ${s.b}</div>${s.sz?`<div class="small mut">Misura minima indicativa: ${s.sz} cm</div>`:''}</div></div>`).join(''):'<div class="mut">Nessuna specie di punta in questo periodo.</div>'}
  </div>
  <div class="card"><h3>Riconosci la specie</h3>
    <p class="small mut">Seleziona le caratteristiche del pesce che hai catturato.</p>
    <label>Forma</label><div class="chips">${shapes.map(x=>`<span class="chip ${AIQ.sh===x?'on':''}" onclick="AIQ.sh=AIQ.sh==='${x}'?null:'${x}';render()">${x}</span>`).join('')}</div>
    <label>Colore dominante</label><div class="chips">${cols.map(x=>`<span class="chip ${AIQ.c===x?'on':''}" onclick="AIQ.c=AIQ.c==='${x}'?null:'${x}';render()">${x}</span>`).join('')}</div>
    <label>Segni particolari</label><div class="chips">${traits.map(x=>`<span class="chip ${AIQ.t.includes(x)?'on':''}" onclick="togTrait('${x.replace(/'/g,"\\'")}')">${x}</span>`).join('')}</div>
    ${(AIQ.sh||AIQ.c||AIQ.t.length)?`<label>Risultati più probabili</label>${cand.map((x,i)=>`<div class="species"><div class="ico">${i?'🐟':'🎯'}</div><div><b>${x.s.n}</b> <i class="small mut">${x.s.s}</i><div class="small">${x.s.f}</div>${x.s.sz?`<div class="small mut">Misura minima indicativa: ${x.s.sz} cm</div>`:''}</div></div>`).join('')||'<div class="mut">Nessuna corrispondenza.</div>'}<button class="btn ghost full" style="margin-top:8px" onclick="AIQ={sh:null,c:null,t:[]};render()">Azzera</button>`:''}
  </div>
  <p class="small mut" style="text-align:center;margin-bottom:12px">Le misure minime sono indicative: verifica sempre la normativa vigente nella tua zona.</p>`;
}
function togTrait(t){const i=AIQ.t.indexOf(t);i<0?AIQ.t.push(t):AIQ.t.splice(i,1);render();}
function advice(){
  const out=[],X=S.wx,mo=new Date().getMonth()+1;
  if(!X){out.push(['⏳','Carico i dati meteo per consigli su misura…']);return out;}
  const now=new Date(),h=X.hours.find(x=>x.t<=now&&x.t.getTime()+3600e3>now)||X.hours[24];
  const today=new Date();today.setHours(0,0,0,0);
  const wins=bestWindows(X,today,1);
  if(wins.length)out.push(['⏰',`Il momento migliore di oggi è tra le <b>${hhmm(wins[0].from)}</b> e le <b>${hhmm(wins[0].to)}</b> (indice ${wins[0].max}).`]);
  else{const nx=X.fdays.slice(1).map(d=>({d,s:dayScore(X,d.date)})).sort((a,b)=>b.s-a.s)[0];if(nx)out.push(['📅',`Oggi poche occasioni: punta su <b>${nx.d.date.toLocaleDateString('it-IT',{weekday:'long'})}</b> (indice ${nx.s}).`]);}
  if(S.mode==='coast'){
    if(h.wave!=null){
      if(h.wave<0.2)out.push(['🪞','Mare piatto: acqua limpida, pesci sospettosi. Usa terminali lunghi e sottili, pesca all\'alba o di notte. Ottimo per spinning leggero e bolognese.']);
      else if(h.wave<=1.3)out.push(['🌊','Mare formato o in scaduta: condizioni ideali per il surfcasting. Cerca la schiuma e le buche oltre il primo frangente; esche: arenicola, bibi, cannolicchio.']);
      else out.push(['⚠️','Mare grosso: pesca solo da posizioni sicure e riparate (porti, foci). Piombi pesanti e montature corte.']);
    }
    if(h.ws>25)out.push(['💨',`Vento sostenuto (${fmt0(h.ws)} km/h): scegli spot sottovento e piombi a grappino.`]);
  }else if(S.mode==='sea'){
    if(h.ws>25||(h.wave||0)>1.5)out.push(['⛔','Condizioni marine impegnative: valuta di non uscire in barca.']);
    else out.push(['🚤',`Vento ${fmt0(h.ws)} km/h${h.wave!=null?', onda '+fmt1(h.wave)+' m':''}: ${h.ws<12?'ottimo per bolentino e vertical jigging':'meglio la traina costiera o il drifting con ancora galleggiante'}.`]);
  }else if(S.mode==='lake'){
    out.push(['🏞️',h.ws>=5&&h.ws<=15?'Il vento increspa la superficie e ossigena: cerca la sponda sottovento, i pesci seguono il cibo spinto dal vento.':'Acqua calma: lavora in profondità con esche naturali o drop shot, e prova la superficie al tramonto.']);
  }else{
    out.push(['🌊',h.pr>=2?'Pioggia in corso: l\'acqua velata può attivare i predatori; evita piene e acqua troppo torbida.':'Acqua normale: cerca correnti di raccordo, lame e i margini dei raschi.']);
  }
  if(h.dp<-0.6)out.push(['📉','Pressione in calo: i pesci tendono ad alimentarsi prima del peggioramento. Approfittane!']);
  else if(h.dp>2)out.push(['📈','Pressione in rapida salita: pesci spesso apatici, rallenta il recupero ed usa esche più piccole.']);
  const ph=moonPhase(now);
  out.push([ph.e,`${ph.name}: ${ph.illum>.85||ph.illum<.15?'fase forte, attività elevata nei periodi solunari.':'fase intermedia, concentrati su alba e tramonto.'}`]);
  if(h.sst!=null)out.push(['🌡️',`Acqua a ${fmt1(h.sst)} °C: ${h.sst<14?'pesci lenti, privilegia esche naturali e ore centrali.':h.sst>24?'acqua calda, pesci attivi di notte e al primo mattino.':'temperatura ottimale per la maggior parte delle specie.'}`]);
  const tech=TECH[S.mode],seasonal=SPECIES.filter(s=>s.m.includes(S.mode)&&s.mo.includes(mo)).slice(0,3).map(s=>s.n);
  if(seasonal.length)out.push(['🎯',`Specie da insidiare ora: <b>${seasonal.join(', ')}</b>. Tecniche consigliate: ${tech.slice(0,3).join(', ')}.`]);
  if(PROFILE){const bh=PROFILE.hrs.indexOf(Math.max(...PROFILE.hrs));out.push(['✨',`Dalle tue ${PROFILE.n} uscite fruttuose: catturi di più intorno alle <b>${pad(bh)}:00</b>${PROFILE.ws!=null?` con vento sui ${fmt0(PROFILE.ws)} km/h`:''}.`]);}
  else out.push(['📓','Registra almeno 3 uscite con catture: l\'indice inizierà ad adattarsi alle tue abitudini.']);
  return out;
}

/* ===================== Sheet ===================== */
function openSheet(html){document.getElementById('sheetBox').innerHTML=html;document.getElementById('sheet').classList.add('on');}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}

(function(){const b=document.getElementById('bubbles');let h='';for(let i=0;i<14;i++){const z=4+Math.random()*12;h+=`<span class="bub" style="left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*16}s;animation-delay:${-Math.random()*20}s"></span>`;}b.innerHTML=h;})();
buildProfile();
render();
loadWeather();
</script>
