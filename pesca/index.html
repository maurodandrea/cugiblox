<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lenza">
<meta name="description" content="Indice di pesca, meteo e mare, spot, diario e statistiche.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lenza · Indice di Pesca</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030d1a; --bg2:#0a1f36; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.06); --line:rgba(255,255,255,.08);
    --txt:#f2f8ff; --mut:#8fa9c4; --acc:#2fe0cf; --acc-b:#3b8cff; --acc2:#ffb547; --bad:#ff6b7a; --ok:#5ee08a;
    --grad:linear-gradient(135deg,#2fe0cf 0%,#3b8cff 100%);
    --grad-warm:linear-gradient(135deg,#ffb547 0%,#ff6b7a 100%);
    --shadow:0 12px 32px -12px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.03) inset;
    --r:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{background:var(--bg);color:var(--txt);font:15px/1.45 'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  /* --- sfondo oceano animato --- */
  .ocean{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:radial-gradient(120% 70% at 50% -10%,#0f4a7a 0%,#082a4d 35%,#04152a 70%,#020a15 100%);}
  .ocean .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:drift 22s ease-in-out infinite alternate;}
  .ocean .b1{width:340px;height:340px;background:#1fc8c0;top:-80px;left:-90px;}
  .ocean .b2{width:300px;height:300px;background:#2a5cff;top:30%;right:-120px;animation-duration:28s;opacity:.3;}
  .ocean .b3{width:260px;height:260px;background:#0fb5a6;bottom:-80px;left:20%;animation-duration:32s;opacity:.25;}
  @keyframes drift{to{transform:translate(60px,80px) scale(1.15);}}
  .ocean .bub{position:absolute;bottom:-20px;border-radius:50%;border:1px solid rgba(180,240,255,.35);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);animation:rise linear infinite;}
  @keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(30px,-110vh);opacity:0}}
  .ocean .rays{position:absolute;inset:-20% -10% auto;height:70%;background:repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 40px,transparent 40px 110px);filter:blur(6px);animation:sway 12s ease-in-out infinite alternate;transform-origin:top;}
  @keyframes sway{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}

  #app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
    background:linear-gradient(180deg,rgba(3,13,26,.85),rgba(3,13,26,.55) 70%,rgba(3,13,26,0));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.3px;}
  .logo .mark{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px -4px rgba(47,224,207,.55);}
  .logo .mark svg{width:22px;height:22px;}
  .logo .ver{font-size:10.5px;font-weight:600;color:var(--mut);letter-spacing:.2px;margin-top:-2px;white-space:nowrap;}
  .logo .word b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .spotchip{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;color:var(--txt);font:600 13px 'Outfit',sans-serif;cursor:pointer;max-width:58%;backdrop-filter:blur(10px);transition:.2s;}
  .spotchip:hover{background:rgba(255,255,255,.12);}
  .spotchip svg{width:16px;height:16px;flex:none;color:var(--acc);}
  .spotchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .modes{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 16px 0;padding:4px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);backdrop-filter:blur(10px);}
  .modes .slider{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px - 12px)/4);border-radius:14px;background:var(--grad);box-shadow:0 6px 18px -6px rgba(47,224,207,.7);transition:transform .35s cubic-bezier(.4,1.4,.5,1);}
  .mode{position:relative;z-index:1;border:0;background:none;color:var(--mut);border-radius:14px;padding:9px 4px;font:600 13px 'Outfit',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:color .25s;}
  .mode svg{width:17px;height:17px;}
  .mode.on{color:#032a2a;}
  main{flex:1;padding:14px 16px 120px;}
  /* --- nav flottante --- */
  nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;z-index:30;display:flex;padding:6px;gap:2px;
    background:rgba(8,24,44,.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:26px;box-shadow:0 18px 40px -10px rgba(0,0,0,.7);}
  nav button{flex:1;position:relative;background:none;border:0;color:var(--mut);padding:8px 0 7px;font:600 10.5px 'Outfit',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:20px;transition:color .2s,background .25s;}
  nav button svg{width:22px;height:22px;transition:transform .25s;}
  nav button.on{color:var(--acc);background:rgba(47,224,207,.12);}
  nav button.on svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px rgba(47,224,207,.6));}
  /* --- card --- */
  .card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  main>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both;}
  main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}main>*:nth-child(6){animation-delay:.25s}main>*:nth-child(n+7){animation-delay:.3s}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .card h3{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin-bottom:12px;font-weight:700;}
  .card h3::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--acc);}
  .row{display:flex;gap:10px;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid2>*{min-width:0;}
  input[type=datetime-local]{min-width:0;font-size:14px;padding:12px 8px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .tile{position:relative;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:12px;}
  .tile .k{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;font-weight:600;}
  .tile .v{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.3px;}
  .tile .s{font-size:12px;color:var(--mut);}
  .mut{color:var(--mut);} .small{font-size:12px;}
  .btn{background:var(--grad);color:#03282a;border:0;border-radius:16px;padding:12px 16px;font:700 14px 'Outfit',sans-serif;cursor:pointer;box-shadow:0 10px 24px -10px rgba(47,224,207,.8);transition:transform .15s,box-shadow .2s;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);box-shadow:none;}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,122,.35);box-shadow:none;}
  .btn.full{width:100%;padding:15px;font-size:15px;}
  .banner{background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);color:#ffd79a;border-radius:16px;padding:10px 14px;font-size:13px;margin-bottom:14px;backdrop-filter:blur(10px);}
  /* --- hero --- */
  .hero{position:relative;overflow:hidden;border-radius:30px;padding:18px 18px 22px;margin-bottom:14px;border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 50px -18px rgba(0,0,0,.7);isolation:isolate;}
  .hero.sky-night{background:linear-gradient(170deg,#101d4a 0%,#0b2d5c 55%,#06345a 100%);}
  .hero.sky-dawn{background:linear-gradient(170deg,#ff9a76 0%,#c86dd7 38%,#3557c9 75%,#0b3f73 100%);}
  .hero.sky-day{background:linear-gradient(170deg,#3fb3ff 0%,#1b7fd6 45%,#0b4d8f 100%);}
  .hero.sky-dusk{background:linear-gradient(170deg,#ff7e5f 0%,#d1497a 35%,#5b3a9e 70%,#0d3466 100%);}
  .hero .stars{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 28%,#fff,transparent),radial-gradient(1px 1px at 10% 40%,#fff,transparent),radial-gradient(1px 1px at 60% 22%,#fff,transparent);opacity:.7;animation:tw 4s ease-in-out infinite alternate;}
  @keyframes tw{to{opacity:.25}}
  .hero .orb{position:absolute;z-index:-1;width:120px;height:120px;border-radius:50%;top:-30px;right:-20px;filter:blur(2px);}
  .sky-night .orb{background:radial-gradient(circle at 35% 35%,#fffbe8,#d9dcef 55%,rgba(217,220,239,0) 72%);opacity:.55;}
  .sky-day .orb,.sky-dawn .orb,.sky-dusk .orb{background:radial-gradient(circle,#fff6c9 0%,#ffd36b 35%,rgba(255,200,80,0) 70%);opacity:.8;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .hero-loc{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;}
  .hero-loc svg{width:16px;height:16px;}
  .hero-date{font-size:13px;opacity:.8;text-transform:capitalize;}
  .hero-wx{text-align:right;line-height:1;}
  .hero-wx .ic{font-size:30px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));}
  .hero-wx b{display:block;font-size:30px;font-weight:300;margin-top:2px;}
  .gauge-wrap{position:relative;width:236px;height:236px;margin:2px auto -14px;}
  .gauge-wrap svg{width:100%;height:100%;overflow:visible;}
  .gauge-arc{animation:arc 1.4s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes arc{from{stroke-dashoffset:100}}
  .gauge-knob{animation:fadein .4s 1.2s both;}
  @keyframes fadein{from{opacity:0}}
  .gauge-wrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px;}
  .gauge-wrap .num b{font-size:72px;line-height:.95;font-weight:800;letter-spacing:-3px;text-shadow:0 6px 30px rgba(0,0,0,.35);}
  .gauge-wrap .num span{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;font-weight:600;margin-top:4px;}
  .gauge-wrap .num .pill{margin-top:8px;font-size:13px;padding:4px 12px;text-transform:none;letter-spacing:0;}
  .hero-exp{text-align:center;font-size:13.5px;opacity:.92;margin:0 auto 14px;max-width:340px;}
  .hero-stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(0,10,30,.28);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:10px 4px;backdrop-filter:blur(8px);}
  .hero-stats div{text-align:center;}
  .hero-stats .ic{font-size:18px;height:22px;display:flex;align-items:center;justify-content:center;}
  .hero-stats .arrow{font-size:20px;color:#fff;}
  .hero-stats b{display:block;font-size:15px;margin-top:2px;}
  .hero-stats span{font-size:10.5px;opacity:.75;text-transform:uppercase;letter-spacing:.6px;}
  .hero .waves{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:-1;}
  .hero .waves use{animation:wave 7s linear infinite;}
  .hero .waves use:nth-child(2){animation-duration:11s;animation-direction:reverse;}
  .hero .waves use:nth-child(3){animation-duration:15s;}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-200px)}}
  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;}
  .pill.solid{color:#04211f;box-shadow:0 6px 16px -6px currentColor;}
  .ring-num{position:relative;width:44px;height:44px;margin:4px auto 2px;}
  .ring-num svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-num b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;}
  /* --- giorni --- */
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .day{flex:1;min-width:66px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:10px 4px;text-align:center;cursor:pointer;transition:.2s;}
  .day:hover{background:rgba(255,255,255,.09);}
  .day.on{background:linear-gradient(180deg,rgba(47,224,207,.22),rgba(59,140,255,.12));border-color:rgba(47,224,207,.6);box-shadow:0 8px 20px -10px rgba(47,224,207,.8);}
  .day .d{font-size:12px;color:var(--mut);text-transform:capitalize;font-weight:600;}
  .day.on .d{color:var(--txt);}
  .day .ic{font-size:22px;margin:2px 0;}
  /* --- finestre --- */
  .win{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);margin-top:8px;border:1px solid rgba(255,255,255,.05);}
  .win:first-of-type{margin-top:0;}
  .win .clock{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;}
  .win .t{flex:1;}
  .win .t b{font-size:17px;}
  .win .meter{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden;}
  .win .meter div{height:100%;border-radius:5px;}
  /* --- ore --- */
  .hours{display:flex;flex-direction:column;gap:4px;}
  .hr{display:grid;grid-template-columns:44px 26px 40px 1fr 54px 52px;align-items:center;gap:6px;padding:9px 8px;border-radius:14px;font-size:13px;}
  .hours .hr:nth-child(odd){background:rgba(255,255,255,.03);}
  .hr.now{background:linear-gradient(90deg,rgba(47,224,207,.18),rgba(47,224,207,.02))!important;box-shadow:inset 3px 0 0 var(--acc);}
  .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bar>div{height:100%;border-radius:6px;}
  .arrow{display:inline-block;color:var(--acc);font-weight:800;}
  .timeline{position:relative;height:38px;border-radius:12px;background:rgba(255,255,255,.05);overflow:hidden;}
  .timeline .seg{position:absolute;top:0;bottom:0;border-radius:6px;}
  .timeline .now{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff;}
  .tl-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:5px;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .moonbig{font-size:46px;line-height:1;filter:drop-shadow(0 0 16px rgba(255,250,220,.35));}
  /* --- mappa e liste --- */
  #map{height:52vh;min-height:300px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
  .pin{position:relative;width:30px;height:30px;}
  .pin i{position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--grad);border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.5);}
  .pin.off i{background:linear-gradient(135deg,#8fa9c4,#4b6684);}
  .pin.on::after{content:'';position:absolute;left:50%;top:100%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--acc);animation:ping 1.8s ease-out infinite;}
  @keyframes ping{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
  .list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .list .it:last-child{border-bottom:0;}
  .list .it .t{flex:1;min-width:0;cursor:pointer;}
  .list .it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ico{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,rgba(47,224,207,.2),rgba(59,140,255,.15));border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;overflow:hidden;}
  .ico img{width:100%;height:100%;object-fit:cover;}
  input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s;}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,224,207,.18);}
  select option{background:#0a1f36;}
  textarea{min-height:80px;resize:vertical;}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px;font-weight:600;letter-spacing:.3px;}
  .sheet{position:fixed;inset:0;z-index:1000;background:rgba(1,6,14,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;}
  .sheet.on{display:flex;animation:fadein .2s both;}
  .sheet .box{background:linear-gradient(180deg,#0e2a48,#081a2e);border:1px solid rgba(255,255,255,.1);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:sheetup .35s cubic-bezier(.2,.9,.2,1) both;}
  .sheet .box::before{content:'';display:block;width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto 14px;}
  @keyframes sheetup{from{transform:translateY(60px);opacity:0}}
  .sheet h2{font-size:21px;margin-bottom:4px;letter-spacing:-.3px;}
  .catch{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;}
  .chip.on{background:var(--grad);color:#03282a;border-color:transparent;font-weight:700;box-shadow:0 6px 14px -6px rgba(47,224,207,.8);}
  .hbars .r{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:8px 0;}
  .hbars .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hbars .bar{height:10px;}
  .hbars .bar div{background:var(--grad);animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
  @keyframes grow{from{transform:scaleX(0)}}
  .vbars{display:flex;align-items:flex-end;gap:3px;height:120px;}
  .vbars div{flex:1;background:linear-gradient(180deg,#2fe0cf,#3b8cff);border-radius:4px 4px 2px 2px;min-height:3px;animation:growy .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom;}
  @keyframes growy{from{transform:scaleY(0)}}
  .tip{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start;}
  .tip>span:first-child{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:17px;}
  .tip:last-child{border-bottom:0;}
  .species{display:flex;gap:12px;padding:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);border-radius:16px;margin-top:8px;}
  .stat-hero .v{font-size:28px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .empty{text-align:center;padding:40px 10px;color:var(--mut);}
  .empty div{font-size:54px;margin-bottom:10px;animation:bob 3s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
  /* --- loader galleggiante --- */
  .loader{display:flex;flex-direction:column;align-items:center;padding:70px 0 30px;color:var(--mut);}
  .loader svg{width:110px;height:110px;}
  .loader .bobber{animation:bobber 1.6s ease-in-out infinite;transform-origin:55px 60px;}
  .loader .rip{animation:rip 1.6s ease-out infinite;transform-origin:55px 72px;}
  .loader .rip.r2{animation-delay:.8s;}
  @keyframes bobber{50%{transform:translateY(6px) rotate(4deg)}}
  @keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(1.4);opacity:0}}
  .toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);background:var(--grad);color:#03282a;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:2000;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 30px -10px rgba(47,224,207,.9);}
  .toast.on{opacity:1;transform:translate(-50%,0);}
  .leaflet-container{background:#0a1f36;font:inherit;}
  .leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.95) contrast(.88) saturate(.7);}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0e2a48;color:var(--txt);border-radius:16px;}
  .leaflet-popup-content a{color:var(--acc);}
  .leaflet-bar a{background:#0e2a48;color:#fff;border-color:rgba(255,255,255,.1);}
  svg text{font-family:'Outfit',sans-serif;}
  /* ---------- v3: nuove funzioni ---------- */
  nav{align-items:flex-end;}
  nav .fab{flex:1.15;position:relative;margin-top:-26px;background:none;padding:0 0 4px;}
  nav .fab .fb{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:var(--grad);color:#03282a;box-shadow:0 12px 26px -8px rgba(47,224,207,.9),0 0 0 5px rgba(3,13,26,.9);transition:transform .2s;}
  nav .fab .fb svg{width:28px;height:28px;}
  nav .fab:active .fb{transform:scale(.92);}
  nav .fab.live .fb{background:linear-gradient(135deg,#ff6b7a,#ff9a5a);box-shadow:0 12px 26px -8px rgba(255,107,122,.9),0 0 0 5px rgba(3,13,26,.9);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{box-shadow:0 12px 30px -4px rgba(255,107,122,1),0 0 0 5px rgba(3,13,26,.9)}}
  nav .fab em{font-style:normal;margin-top:4px;color:var(--txt);}
  .rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 0 rgba(255,77,94,.7);animation:recp 1.4s infinite;}
  @keyframes recp{70%{box-shadow:0 0 0 9px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
  .subhead{display:flex;align-items:center;gap:12px;margin:2px 0 16px;}
  .subhead .back{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;padding-bottom:3px;}
  .subhead h2{font-size:24px;letter-spacing:-.5px;line-height:1.1;}
  .subhead p{font-size:13px;color:var(--mut);}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .quick button{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;color:var(--txt);font:600 12px 'Outfit',sans-serif;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .15s;}
  .quick button:active{transform:scale(.95);}
  .quick button span{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:rgba(47,224,207,.12);}
  .quick button:nth-child(2) span{background:rgba(59,140,255,.16);}
  .quick button:nth-child(3) span{background:rgba(190,150,255,.16);}
  .quick button:nth-child(4) span{background:rgba(255,181,71,.15);}
  .alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;margin-bottom:14px;background:linear-gradient(135deg,rgba(255,107,122,.18),rgba(255,154,90,.1));border:1px solid rgba(255,107,122,.35);font-size:13.5px;}
  .alert .ai{font-size:22px;line-height:1;}
  .alert b{display:block;font-size:14px;}
  .hstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .hstrip::-webkit-scrollbar{display:none;}
  .hcell{min-width:56px;flex:none;text-align:center;padding:10px 4px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);}
  .hcell.now{background:linear-gradient(180deg,rgba(47,224,207,.2),rgba(59,140,255,.06));border-color:rgba(47,224,207,.5);}
  .hcell span{font-size:11.5px;color:var(--mut);font-weight:600;}
  .hcell .wi{font-size:20px;margin:3px 0;}
  .hcell b{font-size:14px;}
  .hcell .ib{width:8px;height:44px;margin:6px auto 3px;border-radius:5px;background:rgba(255,255,255,.08);display:flex;align-items:flex-end;overflow:hidden;}
  .hcell .ib i{display:block;width:100%;border-radius:5px;}
  .hcell em{font-style:normal;font-size:12px;font-weight:700;}
  /* hub */
  .profile{display:flex;align-items:center;gap:16px;}
  .lvl{position:relative;width:92px;height:92px;flex:none;}
  .lvl svg{width:100%;height:100%;transform:rotate(-90deg);}
  .lvl b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;}
  .lvl small{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;font-weight:700;}
  .profile h2{font-size:22px;letter-spacing:-.4px;}
  .xpbar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 4px;}
  .xpbar div{height:100%;background:var(--grad);border-radius:6px;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
  .minis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;text-align:center;}
  .minis b{display:block;font-size:18px;}
  .minis span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;}
  .hub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .hub button{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:22px;padding:16px 14px;color:var(--txt);cursor:pointer;font-family:'Outfit',sans-serif;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:var(--shadow);transition:transform .15s;}
  .hub button:active{transform:scale(.97);}
  .hub button .he{position:absolute;top:12px;left:14px;font-size:30px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));}
  .hub button b{font-size:15.5px;}
  .hub button span{font-size:12px;opacity:.75;}
  .hub button::after{content:'';position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07);}
  /* trofei */
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .bdg{text-align:center;padding:14px 6px 12px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);}
  .bdg .bi{width:60px;height:60px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 30% 25%,#fff6c9,#ffb547 45%,#c86b12 100%);box-shadow:0 8px 20px -6px rgba(255,181,71,.8),inset 0 -4px 8px rgba(0,0,0,.25);}
  .bdg b{display:block;font-size:13px;line-height:1.2;}
  .bdg span{font-size:11px;color:var(--mut);line-height:1.25;display:block;margin-top:3px;}
  .bdg.off .bi{background:rgba(255,255,255,.07);box-shadow:none;filter:grayscale(1);opacity:.45;}
  .bdg.off b{color:var(--mut);}
  /* calendario */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .calhead b{font-size:18px;text-transform:capitalize;}
  .calhead button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font-size:20px;cursor:pointer;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal .wd{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding-bottom:4px;}
  .cal .cd{position:relative;aspect-ratio:1/1.18;border-radius:12px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border:1px solid transparent;font-size:13px;font-weight:600;}
  .cal .cd .m{font-size:14px;line-height:1;}
  .cal .cd .sb{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:3px;}
  .cal .cd.today{border-color:rgba(255,255,255,.5);}
  .cal .cd.sel{background:linear-gradient(180deg,rgba(47,224,207,.28),rgba(59,140,255,.12));border-color:var(--acc);}
  .cal .cd .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc2);}
  .cal .cd.fc::before{content:'';position:absolute;top:4px;left:5px;width:5px;height:5px;border-radius:50%;background:var(--acc);}
  /* live */
  .live-hero{position:relative;overflow:hidden;isolation:isolate;border-radius:30px;padding:20px 18px 24px;margin-bottom:14px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#14507f,#0a2c52 55%,#071d38);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 50px -18px rgba(0,0,0,.7);}
  .live-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:1.5px;padding:6px 12px;border-radius:999px;background:rgba(255,77,94,.16);color:#ff8a96;border:1px solid rgba(255,77,94,.35);}
  .live-time{font-size:62px;font-weight:200;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:8px 0 2px;text-shadow:0 0 30px rgba(47,224,207,.35);}
  .live-sub{font-size:14px;opacity:.85;}
  .live-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative;z-index:2;}
  .live-stats div{background:rgba(0,10,30,.3);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:10px 4px;backdrop-filter:blur(8px);}
  .live-stats b{display:block;font-size:24px;}
  .live-stats span{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.6px;}
  .live-hero .waves{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:-1;}
  .live-hero .waves use{animation:wave 7s linear infinite;}
  .live-hero .waves use:nth-child(2){animation-duration:11s;animation-direction:reverse;}
  .btn.fish{font-size:19px;padding:18px;border-radius:20px;letter-spacing:.3px;}
  .lc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .lc:last-child{border-bottom:0;}
  .lc .tm{font-size:12px;color:var(--mut);width:42px;}
  .lc .x{margin-left:auto;color:var(--bad);cursor:pointer;padding:4px 8px;}
  .toggle{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;font-size:14px;}
  .toggle i{width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:.2s;flex:none;}
  .toggle i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
  .toggle.on i{background:var(--acc);}
  .toggle.on i::after{left:21px;}
  /* confronto */
  .rank{display:flex;align-items:center;gap:12px;}
  .rank .md{font-size:26px;width:34px;text-align:center;flex:none;}
  .rank .t{flex:1;min-width:0;}
  .rank .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank .ring-num{width:54px;height:54px;margin:0;}
  .rank .ring-num b{font-size:16px;}
  .seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:14px;}
  .seg2 button{border:0;border-radius:12px;padding:9px;background:none;color:var(--mut);font:700 13px 'Outfit',sans-serif;cursor:pointer;}
  .seg2 button.on{background:var(--grad);color:#03282a;}
  .seg3{grid-template-columns:repeat(3,1fr);}
  /* guida */
  details.acc{border-bottom:1px solid var(--line);}
  details.acc:last-child{border-bottom:0;}
  details.acc summary{list-style:none;cursor:pointer;padding:13px 0;display:flex;align-items:center;gap:12px;font-weight:600;}
  details.acc summary::-webkit-details-marker{display:none;}
  details.acc summary::after{content:'›';margin-left:auto;font-size:22px;color:var(--mut);transition:transform .2s;}
  details.acc[open] summary::after{transform:rotate(90deg);}
  details.acc summary .ico{width:38px;height:38px;font-size:18px;}
  details.acc summary small{display:block;font-weight:400;color:var(--mut);font-size:12px;}
  details.acc ol{margin:0 0 14px 20px;font-size:14px;color:#d7e6f5;}
  details.acc ol li{margin:5px 0;padding-left:4px;}
  details.acc p{font-size:14px;color:#d7e6f5;margin:0 0 12px;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(47,224,207,.14);color:var(--acc);margin:0 4px 4px 0;}
  /* diario */
  .mhead{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:700;margin:16px 4px 8px;}
  .search{position:relative;margin-bottom:10px;}
  .search input{padding-left:40px;}
  .search::before{content:'🔎';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7;}
  .dcard{display:flex;gap:12px;align-items:center;}
  .dcard .ph{width:64px;height:64px;border-radius:18px;flex:none;overflow:hidden;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,rgba(47,224,207,.2),rgba(59,140,255,.15));}
  .dcard .ph img{width:100%;height:100%;object-fit:cover;}
  .shoot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 12px;margin-bottom:14px;border-radius:22px;border:2px dashed rgba(47,224,207,.5);background:linear-gradient(160deg,rgba(47,224,207,.12),rgba(59,140,255,.06));cursor:pointer;text-align:center;transition:transform .15s;}
  .shoot:active{transform:scale(.98);}
  .shoot input,.snap input,.snapalt input{display:none;}
  .shoot .cam{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:32px;background:var(--grad);box-shadow:0 10px 24px -8px rgba(47,224,207,.9);margin-bottom:6px;}
  .shoot b{font-size:16px;}
  .shoot2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .shoot2 .shoot{padding:16px 8px;}
  .shoot2 .cam{width:54px;height:54px;font-size:27px;}
  .shoot small{font-size:12px;color:var(--mut);}
  .snap{display:flex;gap:8px;margin-top:8px;}
  .snapbtn{flex:1;text-align:center;padding:10px;border-radius:14px;background:rgba(47,224,207,.12);border:1px solid rgba(47,224,207,.35);color:var(--acc);font-weight:700;font-size:13px;cursor:pointer;}
  .snapalt{color:var(--mut);font-size:13px;cursor:pointer;padding:10px 6px;}
  .snap .snapalt{border-radius:14px;border:1px solid var(--line);text-align:center;padding:10px 12px;}
  .cphoto{position:relative;margin-top:8px;}
  .cphoto img{width:100%;max-height:220px;object-fit:cover;border-radius:16px;display:block;cursor:zoom-in;}
  .cphoto.big{margin:0 0 14px;}
  .cphoto.big img{max-height:300px;border-radius:20px;}
  .cphoto span{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;}
  .lcimg{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;cursor:zoom-in;}
  .aibox{display:flex;gap:12px;align-items:center;padding:12px 14px;margin:-4px 0 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .cphoto+.aibox{margin-top:8px;}
  .aibox.ok{background:linear-gradient(150deg,rgba(47,224,207,.16),rgba(59,140,255,.08));border-color:rgba(47,224,207,.4);animation:up .4s both;}
  .aibox.err{background:rgba(255,181,71,.1);border-color:rgba(255,181,71,.35);}
  .aispin{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .aigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px;}
  .aigrid div{background:rgba(0,10,30,.3);border-radius:12px;padding:8px 6px;text-align:center;}
  .aigrid b{display:block;font-size:15px;}
  .aigrid span{font-size:10.5px;color:var(--mut);}
  .mwrap{border-radius:16px;overflow:hidden;background:#000;touch-action:none;}
  .mwrap canvas{display:block;touch-action:none;cursor:crosshair;}
  .mrow{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .dlb{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0 4px;}
  .dlb div{height:100%;background:var(--grad);border-radius:6px;transition:width .2s;}
  /* confetti, celebrazione, benvenuto */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:3000;overflow:hidden;}
  .confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s cubic-bezier(.2,.6,.4,1) forwards;}
  @keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
  .celebrate{text-align:center;padding:10px 4px 4px;}
  .celebrate .bi{width:110px;height:110px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle at 30% 25%,#fff6c9,#ffb547 45%,#c86b12 100%);box-shadow:0 14px 40px -8px rgba(255,181,71,.9);animation:popin .6s cubic-bezier(.3,1.6,.5,1) both;}
  @keyframes popin{from{transform:scale(.2) rotate(-30deg);opacity:0}}
  .celebrate h2{font-size:26px;}
  .celebrate p{margin:4px 0 18px;}
  .welcome{text-align:center;padding:6px 2px 2px;}
  .welcome .wl{width:84px;height:84px;margin:4px auto 14px;border-radius:26px;background:var(--grad);display:grid;place-items:center;box-shadow:0 16px 40px -10px rgba(47,224,207,.9);animation:popin .7s cubic-bezier(.3,1.6,.5,1) both;}
  .welcome .wl svg{width:46px;height:46px;}
  .welcome h2{font-size:28px;letter-spacing:-.6px;}
  .welcome .feat{text-align:left;margin:18px 0;display:grid;gap:10px;}
  .welcome .feat div{display:flex;gap:12px;align-items:center;font-size:14px;}
  .welcome .feat span{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.07);}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .kv:last-child{border-bottom:0;}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
</head>

<div class="ocean"><div class="rays"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="bubbles"></div></div>

  <header>
    <div class="logo"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#03282a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v9.5a4.5 4.5 0 1 1-9 0V10l3 3"/><circle cx="14" cy="3" r="1"/></svg></div><div><span class="word">Len<b>za</b></span><div class="ver" id="ver" data-build="__BUILD__"></div></div></div>
    <button class="spotchip" id="spotChip" onclick="pickSpot()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="spotName">—</span></button>

  <div class="modes" id="modes"></div>
  <main id="view"></main>

</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box" id="sheetBox"></div></div>

<script src="motore.js"></script>
<script>

/* ===================== Astronomia (Luna) ===================== */
const RAD=Math.PI/180;
function jd(date){return date.getTime()/86400000+2440587.5;}
function moonPos(date,lat,lon){
  const d=jd(date)-2451545.0;
  const L=(218.316+13.176396*d)*RAD, M=(134.963+13.064993*d)*RAD, F=(93.272+13.229350*d)*RAD;
  const l=L+6.289*RAD*Math.sin(M), b=5.128*RAD*Math.sin(F), e=23.4397*RAD;
  const ra=Math.atan2(Math.sin(l)*Math.cos(e)-Math.tan(b)*Math.sin(e),Math.cos(l));
  const dec=Math.asin(Math.sin(b)*Math.cos(e)+Math.cos(b)*Math.sin(e)*Math.sin(l));
  const lst=(280.16+360.9856235*d)*RAD+lon*RAD;
  const H=lst-ra, phi=lat*RAD;
  const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  return {alt:alt/RAD,H:((H/RAD)%360+360)%360,lon:l};
}
function moonPhase(date){
  const d=jd(date)-2451545.0;
  const Ms=(357.5291+0.98560028*d)*RAD;
  const sunLon=Ms+(1.9148*Math.sin(Ms)+0.02*Math.sin(2*Ms))*RAD+(102.9372+180)*RAD;
  const ml=moonPos(date,0,0).lon;
  let ph=((ml-sunLon)/RAD)%360; if(ph<0)ph+=360;
  const illum=(1-Math.cos(ph*RAD))/2;
  const names=['Luna nuova','Luna crescente','Primo quarto','Gibbosa crescente','Luna piena','Gibbosa calante','Ultimo quarto','Luna calante'];
  const emo=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  const i=Math.round(ph/45)%8;
  return {angle:ph,illum,age:ph/360*29.53,name:names[i],e:emo[i]};
}
/* Periodi solunari: maggiori = transito/antitransito lunare (±1h), minori = sorgere/tramonto (±30 min) */
function solunar(dayStart,lat,lon){
  const out=[];let prev=null;
  for(let m=-90;m<=24*60+90;m+=5){
    const t=new Date(dayStart.getTime()+m*60000), p=moonPos(t,lat,lon);
    if(prev){
      const hd=((p.H-prev.p.H+540)%360)-180;
      if(prev.p.H>300&&p.H<60) out.push({type:'major',t:interp(prev,{t,p},'H0'),k:'Transito'});
      else if(prev.p.H<180&&p.H>=180&&hd>0) out.push({type:'major',t:interp(prev,{t,p},'H180'),k:'Antitransito'});
      if(prev.p.alt<0&&p.alt>=0) out.push({type:'minor',t:interp(prev,{t,p},'alt'),k:'Sorge la luna'});
      if(prev.p.alt>=0&&p.alt<0) out.push({type:'minor',t:interp(prev,{t,p},'alt'),k:'Tramonta la luna'});
    }
    prev={t,p};
  }
  function interp(a,b,kind){
    let va,vb;
    if(kind==='alt'){va=a.p.alt;vb=b.p.alt;}
    else if(kind==='H0'){va=a.p.H-360;vb=b.p.H;}
    else {va=a.p.H-180;vb=b.p.H-180;}
    const f=va===vb?0:-va/(vb-va);
    return new Date(a.t.getTime()+f*(b.t-a.t));
  }
  return out.map(x=>({...x,from:new Date(x.t.getTime()-(x.type==='major'?60:30)*60000),to:new Date(x.t.getTime()+(x.type==='major'?60:30)*60000)}))
            .filter(x=>x.to>dayStart&&x.from<new Date(dayStart.getTime()+86400000));
}

async function getJSON(u,ms=9000){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(u,{signal:ac.signal});const j=await r.json();if(!r.ok||j.error||!j.hourly)throw new Error('bad');return j;}
  finally{clearTimeout(t);}
}
const wxKey=sp=>'wx_'+sp.lat.toFixed(3)+'_'+sp.lon.toFixed(3);
async function fetchRaw(sp,force){
  const key=wxKey(sp),c=LS.get(key,null);
  if(!force&&c&&Date.now()-c.ts<3600e3)return c;
  const tz='&timezone=auto&past_days=1&forecast_days=7';
  const wu=`https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lon}&hourly=temperature_2m,relative_humidity_2m,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation,weather_code&daily=sunrise,sunset,weather_code,temperature_2m_max,temperature_2m_min${tz}`;
  const mu=`https://marine-api.open-meteo.com/v1/marine?latitude=${sp.lat}&longitude=${sp.lon}&hourly=wave_height,wave_direction,wave_period,sea_surface_temperature,sea_level_height_msl${tz}`;
  let w=null,m=null,sim=false;
  const [rw,rm]=await Promise.allSettled([getJSON(wu),getJSON(mu)]);
  if(rw.status==='fulfilled')w=rw.value;
  if(rm.status==='fulfilled'&&rm.value.hourly.wave_height.some(x=>x!=null))m=rm.value;
  if(!w){if(c&&!c.sim)return c;w=simulate(sp);sim=true;}
  const r={ts:sim?Date.now()-3300e3:Date.now(),w,m,sim};LS.set(key,r);return r;
}
async function loadWeather(force){

// costa.json: linea di costa OpenStreetMap ritagliata sull'Italia e semplificata (~80 m) + centri abitati GeoNames entro 2 km dal mare.
let COSTA=null;
async function costa(){
  if(COSTA)return COSTA;const j=await (await fetch('costa.json')).json(),L=[];
  for(const a of j.c){let x=0,y=0;const p=[];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(let i=0;i<a.length;i+=2){x+=a[i];y+=a[i+1];const X=x/1e4,Y=y/1e4;p.push(X,Y);if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y;}
    L.push({p,bb:[x0,y0,x1,y1]});}
  return COSTA={L,T:j.t};
}
// distanza in km dalla costa (proiezione locale, precisa a pochi metri su queste distanze)
function seaKm(C,lat,lon){
  const kx=111.32*Math.cos(lat*Math.PI/180),ky=110.57;let best=1e9;
  for(const {p,bb} of C.L){
    const dx=Math.max(bb[0]-lon,0,lon-bb[2])*kx,dy=Math.max(bb[1]-lat,0,lat-bb[3])*ky;if(Math.hypot(dx,dy)>=best)continue;
    for(let i=0;i+3<p.length;i+=2){
      const ax=(p[i]-lon)*kx,ay=(p[i+1]-lat)*ky,bx=(p[i+2]-lon)*kx,by=(p[i+3]-lat)*ky,vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy;
      const t=l2?Math.max(0,Math.min(1,-(ax*vx+ay*vy)/l2)):0,d=Math.hypot(ax+t*vx,ay+t*vy);if(d<best)best=d;
    }

}
const kmTo=(sp,lat,lon)=>{const R=6371,r=Math.PI/180;return 2*R*Math.asin(Math.sqrt(Math.sin((lat-sp.lat)*r/2)**2+Math.cos(sp.lat*r)*Math.cos(lat*r)*Math.sin((lon-sp.lon)*r/2)**2));};

async function luoghi(){return LUOGHI||(LUOGHI=await (await fetch('luoghi.json')).json());}  // comuni e quartieri italiani (GeoNames)
async function waterInfo(sp){

  if(sp.lat<35.3||sp.lat>47.2||sp.lon<6||sp.lon>19.6)return null;

    const C=await costa(),km=seaKm(C,+sp.lat,+sp.lon),nb=(list,max)=>{let n=null,nd=max;for(const [m,a,o] of list){const d=kmTo(sp,a,o);if(d<nd){nd=d;n=m;}}return n;};

    let near=nb(C.T,5);

}

function simulate(sp){
  const t0=new Date();t0.setHours(0,0,0,0);t0.setDate(t0.getDate()-1);
  const H={time:[],temperature_2m:[],relative_humidity_2m:[],pressure_msl:[],wind_speed_10m:[],wind_direction_10m:[],wind_gusts_10m:[],cloud_cover:[],precipitation:[],weather_code:[]};
  const D={time:[],sunrise:[],sunset:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[]};
  const doy=d=>Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  for(let i=0;i<24*8;i++){
    const t=new Date(t0.getTime()+i*3600e3),h=t.getHours(),k=i/24;
    const seas=Math.cos((doy(t)-200)/365*2*Math.PI);
    const tmp=14+8*seas+4*Math.sin((h-9)/24*2*Math.PI)+2*Math.sin(k*1.3);
    const ws=10+8*Math.sin(k*1.7+1)+4*Math.sin(h/24*2*Math.PI);
    const cc=clamp(50+45*Math.sin(k*1.1),0,100);
    H.time.push(isoLocal(t));H.temperature_2m.push(tmp);H.relative_humidity_2m.push(65+15*Math.sin(k));
    H.pressure_msl.push(1014+6*Math.sin(k*0.9));H.wind_speed_10m.push(Math.max(1,ws));H.wind_direction_10m.push((200+120*Math.sin(k*0.8)+360)%360);
    H.wind_gusts_10m.push(Math.max(2,ws*1.5));H.cloud_cover.push(cc);H.precipitation.push(cc>88?0.6:0);H.weather_code.push(cc>88?61:cc>70?3:cc>40?2:cc>15?1:0);
  }
  for(let d=0;d<8;d++){
    const t=new Date(t0.getTime()+d*864e5),sr=new Date(t),ss=new Date(t);
    const seas=Math.cos((doy(t)-172)/365*2*Math.PI);
    sr.setHours(6,10-Math.round(seas*75));ss.setHours(18,5+Math.round(seas*75));
    D.time.push(isoLocal(t).slice(0,10));D.sunrise.push(isoLocal(sr));D.sunset.push(isoLocal(ss));
    const sl=H.temperature_2m.slice(d*24,d*24+24);D.temperature_2m_max.push(Math.max(...sl));D.temperature_2m_min.push(Math.min(...sl));
    D.weather_code.push(H.weather_code[d*24+13]);

}
function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function parseLocal(s){const [a,b='00:00']=s.split('T');const [y,mo,da]=a.split('-').map(Number);const [h,mi]=b.split(':').map(Number);return new Date(y,mo-1,da,h,mi);}

function build(w,m,sp,mode=S.mode){
  const H=w.hourly,hours=[],mIdx={};
  if(m&&m.hourly) m.hourly.time.forEach((t,i)=>mIdx[t]=i);
  for(let i=0;i<H.time.length;i++){
    const t=H.time[i],mi=mIdx[t];
    hours.push({
      t:parseLocal(t),iso:t,temp:H.temperature_2m[i],hum:H.relative_humidity_2m?.[i],p:H.pressure_msl[i],
      ws:H.wind_speed_10m[i],wd:H.wind_direction_10m[i],wg:H.wind_gusts_10m[i],cc:H.cloud_cover[i],pr:H.precipitation[i],code:H.weather_code[i],
      wave:mi!=null?m.hourly.wave_height[mi]:null,wper:mi!=null?m.hourly.wave_period[mi]:null,wdir:mi!=null?m.hourly.wave_direction[mi]:null,
      sst:mi!=null?m.hourly.sea_surface_temperature[mi]:null,lvl:mi!=null?m.hourly.sea_level_height_msl?.[mi]:null

  }
  const days=w.daily.time.map((d,i)=>({date:parseLocal(d),sr:parseLocal(w.daily.sunrise[i]),ss:parseLocal(w.daily.sunset[i]),code:w.daily.weather_code[i],tmax:w.daily.temperature_2m_max[i],tmin:w.daily.temperature_2m_min[i]}));

/* ===================== Indice di Pesca ===================== */
const WEIGHTS={
  coast:{press:16,wind:12,wave:20,sol:14,moon:8,light:14,cloud:5,rain:5,sst:6,expo:6},
  sea:{press:16,wind:20,wave:18,sol:14,moon:8,light:12,cloud:4,rain:4,sst:4,expo:6},
  lake:{press:24,wind:12,wave:0,sol:16,moon:8,light:18,cloud:10,rain:8,sst:4},

function factors(X,i,mode){

  else if(mode==='sea') f.wind= ws<=10?1: ws<=18?.75: ws<=28?.35:.05;
  else if(mode==='lake') f.wind= ws<3?.6: ws<=15?1: ws<=25?.6:.3;
  else f.wind= ws<=20?1: ws<=35?.6:.3;
  if(X.face!=null&&h.wd!=null&&(mode==='coast'||mode==='sea')){
    const diff=Math.abs(((h.wd-X.face)%360+540)%360-180);
    h.expo=diff<=60?'mare':diff>=120?'terra':'traverso';
    if(mode==='coast') f.expo= h.expo==='mare'?(ws>=6&&ws<=28?1:ws>35?.4:.75): h.expo==='terra'?.7:.85;
    else f.expo= h.expo==='terra'&&ws>15?.3:.9;
  }
  if(h.wave==null) f.wave=null;
  else if(mode==='coast') f.wave= h.wave<0.15?.45: h.wave<0.4?.75: h.wave<=1.3?1: h.wave<=2?.55:.2;
  else f.wave= h.wave<=0.5?1: h.wave<=1?.75: h.wave<=1.6?.35:.05;
  const day=X.sol[new Date(h.t.getFullYear(),h.t.getMonth(),h.t.getDate()).toDateString()]||[];

let PROFILE=null;
function buildProfile(){
  const ok=S.diary.filter(e=>e.cond&&e.catches&&e.catches.length);
  if(ok.length<3){PROFILE=null;return;}
  const avg=k=>{const v=ok.map(e=>e.cond[k]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const hrs=new Array(24).fill(0);ok.forEach(e=>{const h=new Date(e.start).getHours();hrs[h]++;hrs[(h+1)%24]+=.5;hrs[(h+23)%24]+=.5;});
  PROFILE={n:ok.length,ws:avg('ws'),wave:avg('wave'),dp:avg('dp'),illum:avg('illum'),hrs,max:Math.max(...hrs)};
}
function personalBoost(h,f,mode){
  if(!PROFILE) return 0;
  let sim=0,n=0;
  if(PROFILE.ws!=null){sim+=1-clamp(Math.abs(h.ws-PROFILE.ws)/15,0,1);n++;}
  if(PROFILE.wave!=null&&h.wave!=null){sim+=1-clamp(Math.abs(h.wave-PROFILE.wave)/1,0,1);n++;}
  if(PROFILE.dp!=null&&h.dp!=null){sim+=1-clamp(Math.abs(h.dp-PROFILE.dp)/3,0,1);n++;}
  sim+=PROFILE.hrs[h.t.getHours()]/PROFILE.max;n++;
  const conf=Math.min(1,PROFILE.n/10);
  return (sim/n-.5)*20*conf;
}

function dayScore(X,date){
  const hs=dayHours(X,date);if(!hs.length)return 0;
  const top=hs.map(h=>h.idx).sort((a,b)=>b-a).slice(0,6);

function bestWindows(X,date,n=3){
  const now=new Date();
  const hs=dayHours(X,date).filter(h=>h.t.getTime()+3600e3>now.getTime()||date.toDateString()!==now.toDateString());
  const wins=[];let cur=null;
  const thr=Math.max(50,Math.max(...hs.map(h=>h.idx),0)-12);
  hs.forEach(h=>{
    if(h.idx>=thr){ if(!cur)cur={from:h.t,to:new Date(h.t.getTime()+3600e3),sum:h.idx,n:1,max:h.idx}; else {cur.to=new Date(h.t.getTime()+3600e3);cur.sum+=h.idx;cur.n++;cur.max=Math.max(cur.max,h.idx);} }

  });
  if(cur)wins.push(cur);

function seaState(w){return w<0.1?'calmo':w<0.5?'poco mosso':w<1.25?'mosso':w<2.5?'molto mosso':w<4?'agitato':'grosso';}
function explain(h){
  const f=h.f||{},good=[],bad=[];
  const L={press:'pressione',wind:'vento',wave:'moto ondoso',sol:'periodo solunare',moon:'fase lunare',light:'luce',cloud:'nuvolosità',rain:'pioggia',sst:'temperatura',tide:'marea',expo:'esposizione al vento'};
  for(const k in L){if(f[k]==null)continue;if(f[k]>=.95)good.push(L[k]);else if(f[k]<=.45)bad.push(L[k]);}
  let s='';
  if(good.length)s+='A favore: '+good.slice(0,3).join(', ')+'. ';
  if(bad.length)s+='Contro: '+bad.slice(0,3).join(', ')+'.';
  return s||'Condizioni nella media.';
}
function timeline(sol,D){
  const day0=D?new Date(D.date):new Date();day0.setHours(0,0,0,0);
  const pct=t=>clamp((t-day0)/864e5*100,0,100);
  let seg='';
  if(D&&D.sr&&D.ss){[D.sr,D.ss].forEach(t=>{const a=pct(new Date(t.getTime()-3600e3)),b=pct(new Date(t.getTime()+3600e3));seg+=`<div class="seg" style="left:${a}%;width:${b-a}%;background:#ffb54755"></div>`;});}
  sol.forEach(s=>{const a=pct(s.from),b=pct(s.to);seg+=`<div class="seg" style="left:${a}%;width:${b-a}%;background:${s.type==='major'?'var(--acc)':'#2fd4c466'}"></div>`;});
  const now=new Date(),np=(now-day0)/864e5*100;
  if(np>=0&&np<=100)seg+=`<div class="now" style="left:${np}%"></div>`;
  return `<div class="timeline">${seg}</div><div class="tl-lbl"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`;
}

function var_(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function lineChart(vals,unit,col){
  const W=500,H=120,p=24,v=vals.filter(x=>x!=null);if(!v.length)return '';
  const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  const pts=vals.map((x,i)=>x==null?null:[p+i*(W-2*p)/(vals.length-1||1),H-p-(x-mn)/rg*(H-2*p)]).filter(Boolean);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5"/>
    <text x="${p}" y="12" fill="#93b0cc" font-size="11">max ${fmt1(mx)} ${unit}</text><text x="${p}" y="${H-4}" fill="#93b0cc" font-size="11">min ${fmt1(mn)} ${unit}</text></svg>`;
}
function smooth(pts){
  if(pts.length<2)return '';let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`;}
  return d;
}
function chart(hs){
  const W=500,H=170,p=22,n=hs.length;if(!n)return '';
  const x=i=>p+i*(W-2*p)/(n-1||1),y=v=>H-p-v*(H-2*p-10);
  const wmx=Math.max(30,...hs.map(h=>h.ws));
  const ip=hs.map((h,i)=>[x(i),y(h.idx/100)]),wp=hs.map((h,i)=>[x(i),y(h.ws/wmx)]);
  const line=smooth(ip),area=line+` L${x(n-1)} ${H-p} L${x(0)} ${H-p}Z`;
  const best=hs.reduce((a,h,i)=>h.idx>hs[a].idx?i:a,0);
  const grid=[.25,.5,.75,1].map(k=>`<line x1="${p}" x2="${W-p}" y1="${y(k)}" y2="${y(k)}" stroke="rgba(255,255,255,.06)"/>`).join('');
  const lbl=[0,6,12,18,23].filter(i=>i<n).map(i=>`<text x="${x(i)}" y="${H-4}" fill="#8fa9c4" font-size="11" text-anchor="middle">${pad(hs[i].t.getHours())}:00</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fe0cf" stop-opacity=".55"/><stop offset="1" stop-color="#3b8cff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2fe0cf"/><stop offset="1" stop-color="#3b8cff"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ar)"/><path d="${line}" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linecap="round"/>
    <path d="${smooth(wp)}" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="5 5" opacity=".9"/>
    <circle cx="${ip[best][0]}" cy="${ip[best][1]}" r="11" fill="#2fe0cf" opacity=".25"/><circle cx="${ip[best][0]}" cy="${ip[best][1]}" r="5" fill="#fff" stroke="#2fe0cf" stroke-width="3"/>
    <text x="${clamp(ip[best][0],30,W-30)}" y="${ip[best][1]-16}" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${hs[best].idx} · ${pad(hs[best].t.getHours())}:00</text>${lbl}</svg>
  <div class="legend"><span><i style="background:var(--grad)"></i>Indice di pesca</span><span><i style="background:#ffb547"></i>Vento (max ${fmt0(wmx)} km/h)</span></div>`;
}

function readPhoto(inp,max=640){
  return new Promise(res=>{
    const f=inp.files&&inp.files[0];inp.value='';if(!f)return res(null);
    const url=URL.createObjectURL(f),img=new Image();
    const scaled=(m,q)=>{const k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);};
    // la versione grande serve solo al riconoscimento e non viene salvata
    img.onload=()=>{readPhoto.big=scaled(1280,.85);const sm=scaled(max,.68);URL.revokeObjectURL(url);res(sm);};
    img.onerror=()=>{URL.revokeObjectURL(url);toast('Foto non leggibile');res(null);};
    img.src=url;
  });
}

function advice(){
  const out=[],X=S.wx,mo=new Date().getMonth()+1;
  if(!X){out.push(['⏳','Carico i dati meteo per consigli su misura…']);return out;}
  const now=new Date(),h=X.hours.find(x=>x.t<=now&&x.t.getTime()+3600e3>now)||X.hours[24];
  const today=new Date();today.setHours(0,0,0,0);
  const wins=bestWindows(X,today,1);
  if(wins.length)out.push(['⏰',`Il momento migliore di oggi è tra le <b>${hhmm(wins[0].from)}</b> e le <b>${hhmm(wins[0].to)}</b> (indice ${wins[0].max}).`]);
  else{const nx=X.fdays.slice(1).map(d=>({d,s:dayScore(X,d.date)})).sort((a,b)=>b.s-a.s)[0];if(nx)out.push(['📅',`Oggi poche occasioni: punta su <b>${nx.d.date.toLocaleDateString('it-IT',{weekday:'long'})}</b> (indice ${nx.s}).`]);}
  if(S.mode==='coast'){
    if(h.wave!=null){
      if(h.wave<0.2)out.push(['🪞','Mare piatto: acqua limpida, pesci sospettosi. Usa terminali lunghi e sottili, pesca all\'alba o di notte. Ottimo per spinning leggero e bolognese.']);
      else if(h.wave<=1.3)out.push(['🌊','Mare formato o in scaduta: condizioni ideali per il surfcasting. Cerca la schiuma e le buche oltre il primo frangente; esche: arenicola, bibi, cannolicchio.']);
      else out.push(['⚠️','Mare grosso: pesca solo da posizioni sicure e riparate (porti, foci). Piombi pesanti e montature corte.']);
    }
    if(h.ws>25)out.push(['💨',`Vento sostenuto (${fmt0(h.ws)} km/h): scegli spot sottovento e piombi a grappino.`]);
  }else if(S.mode==='sea'){
    if(h.ws>25||(h.wave||0)>1.5)out.push(['⛔','Condizioni marine impegnative: valuta di non uscire in barca.']);
    else out.push(['🚤',`Vento ${fmt0(h.ws)} km/h${h.wave!=null?', onda '+fmt1(h.wave)+' m':''}: ${h.ws<12?'ottimo per bolentino e vertical jigging':'meglio la traina costiera o il drifting con ancora galleggiante'}.`]);
  }else if(S.mode==='lake'){
    out.push(['🏞️',h.ws>=5&&h.ws<=15?'Il vento increspa la superficie e ossigena: cerca la sponda sottovento, i pesci seguono il cibo spinto dal vento.':'Acqua calma: lavora in profondità con esche naturali o drop shot, e prova la superficie al tramonto.']);
  }else{
    out.push(['🌊',h.pr>=2?'Pioggia in corso: l\'acqua velata può attivare i predatori; evita piene e acqua troppo torbida.':'Acqua normale: cerca correnti di raccordo, lame e i margini dei raschi.']);
  }
  if(h.expo==='terra'&&S.mode==='sea'&&h.ws>15)out.push(['⚠️',`Vento di terra a ${fmt0(h.ws)} km/h: ti spinge al largo. Prudenza con la barca.`]);
  else if(h.expo==='terra'&&S.mode==='coast')out.push(['🏝️','Vento di terra: mare calmo e acqua limpida sotto costa, ideale per spinning leggero e bolognese.']);
  else if(h.expo==='mare'&&S.mode==='coast'&&h.ws>=8)out.push(['🌬️','Vento di mare: smuove il fondale e porta cibo a riva, buono per il surfcasting.']);
  if(h.dp<-0.6)out.push(['📉','Pressione in calo: i pesci tendono ad alimentarsi prima del peggioramento. Approfittane!']);
  else if(h.dp>2)out.push(['📈','Pressione in rapida salita: pesci spesso apatici, rallenta il recupero ed usa esche più piccole.']);
  const ph=moonPhase(now);
  out.push([ph.e,`${ph.name}: ${ph.illum>.85||ph.illum<.15?'fase forte, attività elevata nei periodi solunari.':'fase intermedia, concentrati su alba e tramonto.'}`]);
  if(h.sst!=null)out.push(['🌡️',`Acqua a ${fmt1(h.sst)} °C: ${h.sst<14?'pesci lenti, privilegia esche naturali e ore centrali.':h.sst>24?'acqua calda, pesci attivi di notte e al primo mattino.':'temperatura ottimale per la maggior parte delle specie.'}`]);
  const tech=TECH[S.mode],seasonal=SPECIES.filter(s=>s.m.includes(S.mode)&&s.mo.includes(mo)).slice(0,3).map(s=>s.n);
  if(seasonal.length)out.push(['🎯',`Specie da insidiare ora: <b>${seasonal.join(', ')}</b>. Tecniche consigliate: ${tech.slice(0,3).join(', ')}.`]);
  if(PROFILE){const bh=PROFILE.hrs.indexOf(Math.max(...PROFILE.hrs));out.push(['✨',`Dalle tue ${PROFILE.n} uscite fruttuose: catturi di più intorno alle <b>${pad(bh)}:00</b>${PROFILE.ws!=null?` con vento sui ${fmt0(PROFILE.ws)} km/h`:''}.`]);}
  else out.push(['📓','Registra almeno 3 uscite con catture: l\'indice inizierà ad adattarsi alle tue abitudini.']);
  return out;
}

/* ===================== Sole (alba/tramonto per qualunque data) ===================== */
function sunTimes(date,lat,lon){
  const n=Math.round(jd(new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),12)))-2451545.0);
  const J=n-lon/360,M=(357.5291+0.98560028*J)%360;
  const C=1.9148*Math.sin(M*RAD)+0.02*Math.sin(2*M*RAD)+0.0003*Math.sin(3*M*RAD);
  const lam=(M+C+180+102.9372)%360;
  const Jt=2451545.0+J+0.0053*Math.sin(M*RAD)-0.0069*Math.sin(2*lam*RAD);
  const dec=Math.asin(Math.sin(lam*RAD)*Math.sin(23.44*RAD));
  const cw=(Math.sin(-0.833*RAD)-Math.sin(lat*RAD)*Math.sin(dec))/(Math.cos(lat*RAD)*Math.cos(dec));
  if(Math.abs(cw)>1)return null;
  const w=Math.acos(cw)/RAD/360,toD=j=>new Date((j-2440587.5)*864e5);
  return {sr:toD(Jt-w),ss:toD(Jt+w)};
}

function weatherAlerts(X){
  const now=Date.now(),hs=X.hours.filter(h=>h.t.getTime()>=now-3600e3&&h.t.getTime()<=now+24*3600e3),out=[];

const LEVELS=[[0,'Novellino'],[250,'Apprendista'],[700,'Pescatore'],[1600,'Esperto'],[3200,'Maestro'],[6000,'Lupo di mare'],[11000,'Leggenda']];
function career(){
  const D=S.diary,all=D.flatMap(e=>(e.catches||[]).map(c=>({...c,e})));
  const hr=e=>parseLocal(e.start).getHours();
  const c={out:D.length,n:all.length,species:new Set(all.map(x=>String(x.sp).trim().toLowerCase())).size,kg:all.reduce((a,x)=>a+(+x.w||0),0),
    maxW:Math.max(0,...all.map(x=>+x.w||0)),night:D.some(e=>hr(e)>=21||hr(e)<4),dawn:D.some(e=>hr(e)>=4&&hr(e)<=7),rel:all.filter(x=>x.rel).length,
    spots:new Set(D.map(e=>e.spot)).size,modes:new Set(D.map(e=>e.mode)).size,long:D.some(e=>parseLocal(e.end)-parseLocal(e.start)>=6*3600e3),
    skunk:D.some(e=>!e.catches?.length),multi:D.some(e=>(e.catches?.length||0)>=5)};
  c.unlocked=BADGES.filter(b=>b[4](c)).map(b=>b[0]);
  c.xp=c.out*20+c.n*10+Math.round(c.kg*15)+c.species*40+c.unlocked.length*50;
  let i=0;while(i<LEVELS.length-1&&c.xp>=LEVELS[i+1][0])i++;
  c.lvl={n:i+1,name:LEVELS[i][1],from:LEVELS[i][0],to:LEVELS[i+1]?.[0]??null};
  c.lvl.pct=c.lvl.to?(c.xp-c.lvl.from)/(c.lvl.to-c.lvl.from):1;
  return c;
}

function lunarScore(d){const ph=moonPhase(d),n=Math.min(ph.angle,Math.abs(ph.angle-180),360-ph.angle);return Math.round(30+55*(1-n/90));}

  if(!S.calSel)S.calSel=today;
  const cell=dd=>{
    const d=new Date(y,m,dd),ds=d.toDateString(),mid=new Date(y,m,dd,12),ph=moonPhase(mid);
    const fc=S.wx&&S.wx.fdays.some(x=>x.date.toDateString()===ds),sc=fc?dayScore(S.wx,d):lunarScore(mid);

    <div class="cal">${['L','M','M','G','V','S','D'].map(x=>`<div class="wd">${x}</div>`).join('')}${'<div></div>'.repeat(lead)}${Array.from({length:nd},(_,i)=>cell(i+1)).join('')}</div>

    <div class="small mut">${ph.name} · ${Math.round(ph.illum*100)}% illuminata · età ${fmt1(ph.age)} giorni</div></div>${miniRing(sc)}</div>
    <div class="small mut" style="margin:10px 0 8px">${fc?'Indice basato sulle previsioni meteo':'Indice basato solo su luna e periodi solunari'}${sun?` · 🌅 ${hhmm(sun.sr)} · 🌇 ${hhmm(sun.ss)}`:''}</div>

}

let COMP={ts:0,rows:null,loading:false};
async function runCompare(force){
  if(COMP.loading)return;COMP.loading=true;if(S.tab==='compare')render();
  const rows=[],t0=new Date();t0.setHours(0,0,0,0);
  for(const sp of S.spots.slice(0,12)){
    try{
      const r=await fetchRaw(sp,force),X=build(r.w,r.m,sp,sp.mode||S.mode);
      const h=X.hours.find(x=>x.t<=new Date()&&x.t.getTime()+3600e3>Date.now());
      const t1=X.fdays[1]?.date;
      rows.push({sp,sim:r.sim,now:h?.idx,code:h?.code,temp:h?.temp,s:[dayScore(X,t0),t1?dayScore(X,t1):0],w:[bestWindows(X,t0,1)[0],t1?bestWindows(X,t1,1)[0]:null]});

  }
  COMP={ts:Date.now(),rows,loading:false};if(S.tab==='compare')render();

function wipeAll(){
  if(!confirm('Cancellare spot, diario, trofei e impostazioni? L\'operazione non è reversibile.'))return;

/* ===================== Cartolina da condividere ===================== */
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
async function shareEntry(id){
  const e=S.diary.find(x=>x.id===id);if(!e)return;
  toast('Preparo la cartolina…');
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  try{await document.fonts.load('800 80px Outfit');await document.fonts.load('300 80px Outfit');}catch(err){}
  let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0f4a7a');bg.addColorStop(.55,'#072a4d');bg.addColorStop(1,'#020a15');g.fillStyle=bg;g.fillRect(0,0,W,H);
  const glow=g.createRadialGradient(W*.2,80,10,W*.2,80,600);glow.addColorStop(0,'rgba(47,224,207,.35)');glow.addColorStop(1,'rgba(47,224,207,0)');g.fillStyle=glow;g.fillRect(0,0,W,H);
  const px=60,py=60,pw=W-120,ph=720;
  const best0=(e.catches||[]).slice().sort((a,b)=>(+b.w||0)-(+a.w||0))[0],pic=best0?.photo||entryPhoto(e);
  if(pic){
    const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=pic;});
    if(img){g.save();rrect(g,px,py,pw,ph,48);g.clip();const k=Math.max(pw/img.width,ph/img.height);g.drawImage(img,px+(pw-img.width*k)/2,py+(ph-img.height*k)/2,img.width*k,img.height*k);
      const sh=g.createLinearGradient(0,py+ph-260,0,py+ph);sh.addColorStop(0,'rgba(2,10,21,0)');sh.addColorStop(1,'rgba(2,10,21,.7)');g.fillStyle=sh;g.fillRect(px,py,pw,ph);g.restore();}
  }else{
    g.save();rrect(g,px,py,pw,ph,48);g.clip();const sea=g.createLinearGradient(0,py,0,py+ph);sea.addColorStop(0,'#1b7fd6');sea.addColorStop(1,'#063a66');g.fillStyle=sea;g.fillRect(px,py,pw,ph);
    for(let k=0;k<3;k++){g.fillStyle=`rgba(255,255,255,${.06+k*.04})`;g.beginPath();g.moveTo(px,py+ph-200+k*60);for(let x=0;x<=pw;x+=20)g.lineTo(px+x,py+ph-200+k*60+Math.sin(x/90+k)*22);g.lineTo(px+pw,py+ph);g.lineTo(px,py+ph);g.fill();}
    g.fillStyle='#fff';g.font='300px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e.catches?.length?'🐟':'🎣',W/2,py+ph/2-40);g.restore();
  }
  g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=3;rrect(g,px,py,pw,ph,48);g.stroke();
  const best=(e.catches||[]).slice().sort((a,b)=>(+b.w||0)-(+a.w||0))[0],sp=S.spots.find(s=>s.id===e.spot);
  g.textAlign='left';g.textBaseline='alphabetic';g.fillStyle='#fff';g.font='800 96px Outfit, sans-serif';
  let title=best?best.sp:'Giornata di pesca';while(g.measureText(title).width>W-120&&title.length>3)title=title.slice(0,-2);
  g.fillText(title,px,py+ph+130);
  const tg=g.createLinearGradient(px,0,px+700,0);tg.addColorStop(0,'#2fe0cf');tg.addColorStop(1,'#3b8cff');g.fillStyle=tg;g.font='700 60px Outfit, sans-serif';
  g.fillText(best?[best.w?fmt1(best.w)+' kg':'',best.l?best.l+' cm':''].filter(Boolean).join(' · ')||`${e.catches.length} catture`:'Il cappotto fa parte del gioco',px,py+ph+215);
  g.fillStyle='rgba(234,244,255,.8)';g.font='400 40px Outfit, sans-serif';
  g.fillText(`${e.catches?.length||0} catture · ${e.tech||''}`,px,py+ph+290);
  g.fillText(`📍 ${sp?.name||''} · ${parseLocal(e.start).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}`,px,py+ph+350);
  g.fillStyle=tg;rrect(g,px,H-110,64,64,18);g.fill();g.save();g.translate(px+12,H-98);g.scale(1.7,1.7);g.strokeStyle='#03282a';g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.stroke(new Path2D('M14 3v9.5a4.5 4.5 0 1 1-9 0V10l3 3'));g.restore();
  g.textAlign='left';g.fillStyle='#fff';g.font='800 46px Outfit, sans-serif';g.fillText('Lenza',px+84,H-62);
  if(e.cond?.idx!=null){g.textAlign='right';g.fillStyle=idxColor(e.cond.idx);g.font='700 38px Outfit, sans-serif';g.fillText(`Indice ${e.cond.idx} · ${idxLabel(e.cond.idx)[0]}`,W-px,H-64);}
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
