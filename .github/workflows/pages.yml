name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/html-game-rome-characters-W2Zcw", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Data e ora della versione di Lenza
        run: sed -i "s|__BUILD__|$(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')|" pesca/index.html misurazione/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
